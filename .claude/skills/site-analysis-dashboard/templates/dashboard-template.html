  const t=$('#brand-title'),eb=$('#brand-eyebrow'),btn=$('#brand-edit');
  [t,eb].forEach(n=>n.contentEditable=on?'true':'false');
  btn.textContent=on?'✓':'✎';btn.title=on?'Save title':'Edit title';
  if(on){t.focus();
    const sel=window.getSelection(),r=document.createRange();r.selectNodeContents(t);sel.removeAllRanges();sel.addRange(r);
  }else{
    try{localStorage.setItem(TITLE_LS,t.innerHTML);localStorage.setItem(EYEBROW_LS,eb.textContent);}catch(e){}
    document.title=(t.innerHTML||'').replace(/<br\s*\/?>/gi,' ').replace(/<[^>]+>/g,'').replace(/\s+/g,' ').trim();
  }
}
$('#brand-edit').onclick=()=>setTitleEditable($('#brand-title').getAttribute('contenteditable')!=='true');
$('#brand-title').addEventListener('keydown',e=>{if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();setTitleEditable(false);}if(e.key==='Escape'){setTitleEditable(false);}});
$('#lb-close').onclick=closeLB;
$('#lb-prev').onclick=()=>lbNav(-1);
$('#lb-next').onclick=()=>lbNav(1);
$('#lightbox').addEventListener('click',e=>{if(e.target.id==='lightbox')closeLB();});
document.addEventListener('keydown',e=>{
  if(!$('#lightbox').classList.contains('open'))return;
  const solo=$('#lightbox').classList.contains('solo');
  if(e.key==='Escape')closeLB();
  else if(!solo&&e.key==='ArrowLeft')lbNav(-1);
  else if(!solo&&e.key==='ArrowRight')lbNav(1);
});
buildNav();
renderers.overview();rendered.overview=true;
</script>
<div id="hilr-toast"></div>
<script id="__review" type="application/json"></script>
<script>
/* ===== Human-in-the-loop Review module ===== */
(function(){
  var CX=['Simple','Medium','Complex'], TY=['Core','Custom'];
  var LS_KEY='saran-hilr-review-v1';
  var FAMILY_TYPE={Hero:'Core',Cards:'Core',Columns:'Core',Carousel:'Core',Tabs:'Core',Accordion:'Core',Table:'Core',Video:'Core',Form:'Core',Breadcrumbs:'Core',Header:'Core',Footer:'Core','Unknown / Custom':'Custom'};
  var FAMILY_CX={Hero:'Medium',Cards:'Medium',Columns:'Medium',Carousel:'Complex',Tabs:'Medium',Accordion:'Medium',Table:'Medium',Video:'Medium',Form:'Complex',Breadcrumbs:'Simple',Header:'Complex',Footer:'Complex','Unknown / Custom':'Complex'};
  var FAMILY_CORE={Hero:'Hero',Cards:'Cards',Columns:'Columns',Carousel:'Carousel',Tabs:'Tabs',Accordion:'Accordion',Table:'Table',Video:'Embed / Video',Form:'Form',Breadcrumbs:'Breadcrumbs',Header:'Header',Footer:'Footer','Unknown / Custom':''};
  var FAMILY_TYPEKEY={Hero:'hero',Cards:'cards',Columns:'columns',Carousel:'carousel',Tabs:'tabs',Accordion:'accordion',Table:'table',Video:'video',Form:'form',Breadcrumbs:'breadcrumbs',Header:'header',Footer:'footer','Unknown / Custom':'unknown'};

  var DEFAULT_HOURS={Core:{Simple:8,Medium:20,Complex:48},Custom:{Simple:14,Medium:35,Complex:84}};
  function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

  // ---------- seed from analysis ----------
  function seed(){
    var typeSummary={}; (DATA.blocktype_summary||[]).forEach(function(s){ typeSummary[s.type]=s; });
    var items=[], ord=0;
    (DATA.galleries||[]).forEach(function(g){
      var fam=g.name, mid='m-'+slug(fam);
      var t=FAMILY_TYPE[fam]||'Custom', cx=FAMILY_CX[fam]||'Medium';
      var sum=typeSummary[FAMILY_TYPEKEY[fam]]||{};
      var noteBits=[];
      if(sum.variants) noteBits.push(sum.variants+' variants');
      if(sum.instances) noteBits.push(sum.instances+' instances site-wide');
      if(sum.pct) noteBits.push(sum.pct+' of all variants');
      if(sum.eds) noteBits.push('detector class: '+sum.eds);
      var firstImg=(g.variants[0]&&g.variants[0].img)||'';
      items.push({id:mid,parentId:null,ord:ord++,name:fam,internalId:'BLK-'+slug(fam).toUpperCase(),
        img:firstImg,sourceUrl:(g.variants[0]&&g.variants[0].url)||'',type:t,complexity:cx,
        coreBlockType:FAMILY_CORE[fam]||'',notes:noteBits.join(' · '),patterns:[],
        tags:[slug(fam),(t==='Custom'?'custom':'core')],selected:true});
      g.variants.forEach(function(v){
        items.push({id:'v-'+v.id,parentId:mid,ord:ord++,name:v.id,internalId:'',
          img:v.img||'',sourceUrl:v.url||'',type:t,complexity:cx,coreBlockType:'',
          notes:v.traits||'',patterns:[],tags:[],selected:true});
      });
    });
    return {
      engagement:{accountName:'Asahi Kasei — Saran',dealRegNo:'',caseId:'',solutionArchitect:'',executor:'',startDate:'',remarks:'Pre-seeded from the automated site analysis of the /saran/ hierarchy ('+((DATA.meta&&DATA.meta['Pages analyzed'])||'')+'). Review, re-categorize, adjust complexity/type and refine the effort estimate below.'},
      generated:(DATA.meta&&DATA.meta['Analysis date'])||'',
      hours:JSON.parse(JSON.stringify(DEFAULT_HOURS)),
      defaultHours:JSON.parse(JSON.stringify(DEFAULT_HOURS)),
      ui:{sort:'orig',filter:[]},
      items:items
    };
  }

  // ---------- load / persist ----------
  var D;
  function load(){
    var raw=null;
    try{ raw=localStorage.getItem(LS_KEY); }catch(e){}
    if(!raw){ var tag=document.getElementById('__review'); if(tag && tag.textContent.trim()) raw=tag.textContent; }
    if(raw){ try{ D=JSON.parse(raw); }catch(e){ D=null; } }
    if(!D || !D.items || !D.items.length) D=seed();
    if(!D.ui) D.ui={sort:'orig',filter:[]};
    if(!D.hours) D.hours=JSON.parse(JSON.stringify(DEFAULT_HOURS));
    if(!D.defaultHours) D.defaultHours=JSON.parse(JSON.stringify(DEFAULT_HOURS));
    D.items.forEach(function(it){ if(!it.tags)it.tags=[]; if(!it.patterns)it.patterns=[]; if(it.selected===undefined)it.selected=true; });
  }
  function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(D)); }catch(e){} }

  // ---------- image resolution ----------
  function imgSrc(x){ if(!x) return ''; if(typeof IMAGES!=='undefined' && IMAGES[x]) return IMAGES[x]; if(String(x).slice(0,5)==='data:') return x; return ''; }
  function syncSrcLink(sel, id, url){ var a=$(sel+'[data-id="'+id+'"]'); if(!a) return; url=(url||'').trim(); if(url){ a.href=abs(url); a.style.display=''; } else { a.removeAttribute('href'); a.style.display='none'; } }

  // ---------- data helpers ----------
  function newId(){ return 'B'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function byId(id){ for(var i=0;i<D.items.length;i++){ if(D.items[i].id===id) return D.items[i]; } return null; }
  function childrenOf(id){ return D.items.filter(function(it){ return it.parentId===id; }).sort(function(a,b){ return a.ord-b.ord; }); }
  function allMains(){ return D.items.filter(function(it){ return it.parentId==null; }); }
  function nextOrd(){ var m=-1; D.items.forEach(function(it){ if(it.ord>m) m=it.ord; }); return m+1; }
  function mkItem(o){ var b={id:newId(),parentId:null,ord:nextOrd(),name:'',internalId:'',img:'',sourceUrl:'',type:'Custom',complexity:'Medium',coreBlockType:'',notes:'',patterns:[],tags:[],selected:true}; for(var k in o) b[k]=o[k]; return b; }
  function sortedMains(){
    var m=allMains().slice();
    if(D.ui.sort==='az') m.sort(function(a,b){ var x=(a.name||'').toLowerCase(),y=(b.name||'').toLowerCase(); return x<y?-1:(x>y?1:a.ord-b.ord); });
    else if(D.ui.sort==='za') m.sort(function(a,b){ var x=(a.name||'').toLowerCase(),y=(b.name||'').toLowerCase(); return x>y?-1:(x<y?1:a.ord-b.ord); });
    else m.sort(function(a,b){ return a.ord-b.ord; });
    return m;
  }
  function passesFilter(it){ if(!D.ui.filter.length) return true; for(var i=0;i<it.tags.length;i++){ if(D.ui.filter.indexOf(it.tags[i])>=0) return true; } return false; }
  function displayMains(){ return sortedMains().filter(passesFilter); }
  function effortMains(){ return displayMains().filter(function(it){ return it.selected!==false; }); }
  function allTags(){ var s={}; D.items.forEach(function(it){ (it.tags||[]).forEach(function(t){ s[t]=1; }); }); return Object.keys(s).sort(); }
  function parseTags(str){ var seen={},out=[]; String(str||'').split(',').forEach(function(t){ t=t.trim(); if(t&&!seen[t.toLowerCase()]){ seen[t.toLowerCase()]=1; out.push(t); } }); return out; }

  // ---------- image ingestion ----------
  var pasteTarget=null, fileMode=null;
  function prepImage(file, cb){
    if(!file || !/^image\//.test(file.type)){ cb(null); return; }
    var url=URL.createObjectURL(file), im=new Image();
    function fallback(){ var r=new FileReader(); r.onload=function(){ cb(r.result); }; r.onerror=function(){ cb(null); }; r.readAsDataURL(file); }
    im.onload=function(){
      var max=1600, w=im.naturalWidth, h=im.naturalHeight;
      if(!w||!h||Math.max(w,h)<=max){ URL.revokeObjectURL(url); fallback(); return; }
      var s=max/Math.max(w,h), cw=Math.round(w*s), ch=Math.round(h*s);
      try{ var c=document.createElement('canvas'); c.width=cw; c.height=ch; c.getContext('2d').drawImage(im,0,0,cw,ch); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg',0.82)); }
      catch(e){ URL.revokeObjectURL(url); fallback(); }
    };
    im.onerror=function(){ URL.revokeObjectURL(url); fallback(); };
    im.src=url;
  }
  function collectImageFiles(list){ var out=[]; if(!list) return out; for(var i=0;i<list.length;i++){ var f=list[i]; if(f && /^image\//.test(f.type)) out.push(f); } return out; }
  function handleFiles(fileList, mode){
    var files=collectImageFiles(fileList);
    if(!files.length){ toast('No image found in that.'); return; }
    var results=new Array(files.length), done=0;
    files.forEach(function(f,idx){ prepImage(f,function(u){ results[idx]=u; if(++done===files.length){ applyImages(results.filter(Boolean), mode||{}); } }); });
  }
  function applyImages(urls, mode){
    if(!urls.length) return;
    if(mode.type==='image'){ var b=byId(mode.id); if(b)b.img=urls[0]; urls.slice(1).forEach(function(u){ addVariationData(mode.id,u); }); }
    else if(mode.type==='variation'){ urls.forEach(function(u){ addVariationData(mode.parentId,u); }); }
    else { urls.forEach(function(u){ addMainData(u); }); }
    disarm(); persist(); refreshAll();
    toast(urls.length+' image'+(urls.length>1?'s':'')+' added.');
  }
  function addMainData(im){ var n=allMains().length+1; D.items.push(mkItem({parentId:null,img:im||'',name:'Block '+n})); }
  function addVariationData(parentId, im){ var p=byId(parentId); if(!p||p.parentId!=null) parentId=(p&&p.parentId)||parentId; var n=childrenOf(parentId).length+1; D.items.push(mkItem({parentId:parentId,img:im||'',name:'Variation '+n})); }
  function deleteBlock(id){
    var b=byId(id); if(!b) return;
    var kids=childrenOf(id);
    if(b.parentId==null && kids.length){
      if(!confirm('Delete "'+(b.name||'this block')+'" and its '+kids.length+' variation'+(kids.length>1?'s':'')+'?\n\nTo keep a variation, split it into its own block first.')) return;
      D.items=D.items.filter(function(it){ return it.id!==id && it.parentId!==id; });
    } else { D.items=D.items.filter(function(it){ return it.id!==id; }); }
    disarm(); persist(); refreshAll();
  }

  function arm(target, text){ pasteTarget=target; fileMode=target; var bar=$('#hilr-armbar'); $('#hilr-armtext').textContent=text; bar.classList.add('on'); }
  function disarm(){ pasteTarget=null; fileMode=null; var bar=$('#hilr-armbar'); if(bar) bar.classList.remove('on'); }
  function toast(msg){ var t=$('#hilr-toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); }, 1900); }

  // ---------- lightbox (reuse dashboard shell) ----------
  function openReviewImg(src, title){
    var lb=$('#lightbox'); lb.classList.remove('tallshot'); lb.classList.add('solo');
    $('#lb-card').innerHTML='<div class="lb-img" style="align-items:flex-start"><img src="'+src+'" alt="'+esc(title||'')+'" style="max-width:100%"></div>';
    lb.classList.add('open'); document.body.style.overflow='hidden';
  }

  // ---------- engagement ----------
  function engHtml(){
    var e=D.engagement, f=[['accountName','Account / customer','e.g. Asahi Kasei'],['dealRegNo','Deal reg #',''],['caseId','Case ID',''],['solutionArchitect','Solution architect',''],['executor','Executor / reviewer',''],['startDate','Start date','']];
    var h='<div class="engform">';
    f.forEach(function(x){ h+='<label class="engfield"><span>'+x[1]+'</span><input type="text" class="eng-inp" data-k="'+x[0]+'" value="'+esc(e[x[0]]||'')+'" placeholder="'+esc(x[2])+'"></label>'; });
    h+='<label class="engfield full"><span>Remarks</span><input type="text" class="eng-inp" data-k="remarks" value="'+esc(e.remarks||'')+'" placeholder="Notes about this engagement (optional)"></label>';
    h+='<div class="enggen">Baseline generated '+esc(D.generated||'—')+'</div></div>';
    return h;
  }

  // ---------- controls ----------
  function controlsHtml(){
    var opts=[['orig','Original order'],['az','Name A–Z'],['za','Name Z–A']];
    var h='<div class="hilr-ctrls"><label class="cl">Sort by <select id="rvSort">';
    opts.forEach(function(o){ h+='<option value="'+o[0]+'"'+(D.ui.sort===o[0]?' selected':'')+'>'+o[1]+'</option>'; });
    h+='</select></label>';
    var tags=allTags();
    if(tags.length){
      h+='<span class="fsep">Filter by tag:</span><span class="tagfilter">';
      tags.forEach(function(t){ var on=D.ui.filter.indexOf(t)>=0; h+='<label class="tchip'+(on?' on':'')+'"><input type="checkbox" class="rvTf" value="'+esc(t)+'"'+(on?' checked':'')+'> '+esc(t)+'</label>'; });
      h+='</span>';
      if(D.ui.filter.length) h+='<button class="hilr-link" id="rvClrFilter" type="button">Clear filter</button>';
    } else { h+='<span class="fsep muted">Add tags in the table to enable category filtering.</span>'; }
    h+='</div>';
    return h;
  }
  function mvMainOptions(m){ var kids=childrenOf(m.id).map(function(c){return c.id;}); var h='<option value="">Make this a variation of…</option>'; sortedMains().forEach(function(t){ if(t.id!==m.id && kids.indexOf(t.id)<0) h+='<option value="'+t.id+'">→ '+esc(t.name||'(unnamed)')+'</option>'; }); return h; }
  function mvVarOptions(v){ var h='<option value="">Split or move…</option><option value="__main">⬆ Split into its own block</option>'; sortedMains().forEach(function(t){ if(t.id!==v.parentId) h+='<option value="'+t.id+'">Move under: '+esc(t.name||'(unnamed)')+'</option>'; }); return h; }

  // ---------- blocks table ----------
  function mainImgCell(b){ var s=imgSrc(b.img); if(s) return '<img class="rvzoom th" src="'+s+'" data-title="'+esc(b.name)+'" alt="">'; return '<div class="imgdrop main-imgdrop" data-id="'+b.id+'"><b>＋</b>Add image<span>paste · drop · click</span></div>'; }
  function blocksTable(){
    var mains=displayMains();
    var h=controlsHtml()+'<div class="hilr-tblwrap"><table class="hilr-t"><thead><tr><th style="width:40px">Incl.</th><th>Main block</th><th>Variations</th><th style="min-width:280px">Notes</th><th style="width:112px">Build complexity</th><th style="width:88px">Type</th><th style="width:110px">Core block type</th><th style="width:120px">Tags</th></tr></thead><tbody>';
    if(!allMains().length){ h+='<tr><td colspan="8"><div class="rv-empty"><h3>No blocks yet</h3><div>Copy a screenshot, then press <b>⌘/Ctrl+V</b> — or drop images on the zone above — to add your first block.</div></div></td></tr>'; return h+'</tbody></table></div>'; }
    if(!mains.length) h+='<tr><td colspan="8" class="muted c">No blocks match the current filter.</td></tr>';
    mains.forEach(function(b){
      var kids=childrenOf(b.id);
      var main='<div class="mb">'+mainImgCell(b)+'<div class="mbmeta">'
        +'<input type="text" class="f-name" data-id="'+b.id+'" value="'+esc(b.name)+'" placeholder="Name this block">'
        +'<input type="text" class="f-id" data-id="'+b.id+'" value="'+esc(b.internalId)+'" placeholder="ID (e.g. BLK-001)">'
        +'<div class="srcrow"><input type="text" class="f-src" data-id="'+b.id+'" value="'+esc(b.sourceUrl)+'" placeholder="Source URL (optional)"><a class="src-open" data-id="'+b.id+'" href="'+esc(abs(b.sourceUrl))+'" target="_blank" rel="noopener" title="Open source page in a new tab"'+(b.sourceUrl?'':' style="display:none"')+'>open ↗</a></div>'
        +'<div class="mvrow"><select class="mv-main" data-id="'+b.id+'" title="Demote this block to a variation of another block">'+mvMainOptions(b)+'</select>'
        +'<button type="button" class="rowbtn danger del-main" data-id="'+b.id+'">🗑 Delete</button></div></div></div>';
      var vh=kids.map(function(v){ var vs=imgSrc(v.img);
        return '<div class="vb">'+(vs?'<img class="rvzoom vth" src="'+vs+'" data-title="'+esc(v.name)+'" alt="">':'<div class="noimg vth">no image</div>')
          +'<input type="text" class="vbn-inp" data-id="'+v.id+'" value="'+esc(v.name)+'" placeholder="Variation name">'
          +'<input type="text" class="vsrc-inp" data-id="'+v.id+'" value="'+esc(v.sourceUrl)+'" placeholder="Source URL">'
          +'<a class="vsrc-open" data-id="'+v.id+'" href="'+esc(abs(v.sourceUrl))+'" target="_blank" rel="noopener" title="Open source page in a new tab"'+(v.sourceUrl?'':' style="display:none"')+'>open source ↗</a>'
          +'<select class="mv-var" data-id="'+v.id+'" title="Split into its own block, or move under another block">'+mvVarOptions(v)+'</select>'
          +'<button type="button" class="rowbtn danger vdel del-var" data-id="'+v.id+'">✕ Remove</button></div>';
      }).join('');
      vh+='<div class="addvar" data-id="'+b.id+'" title="Add a variation to this block"><b>＋</b>Add variation<span style="display:block">paste · drop · click</span></div>';
      var cxsel='<select class="cx-sel cx-'+b.complexity.toLowerCase()+'" data-id="'+b.id+'">'+CX.map(function(o){return '<option '+(b.complexity===o?'selected':'')+'>'+o+'</option>';}).join('')+'</select>';
      var tysel='<select class="ty-sel" data-id="'+b.id+'">'+TY.map(function(o){return '<option '+(b.type===o?'selected':'')+'>'+o+'</option>';}).join('')+'</select>';
      var incl=(b.selected!==false);
      h+='<tr class="brow'+(incl?'':' excluded')+'" data-id="'+b.id+'">'
        +'<td class="c"><input type="checkbox" class="sel-chk" data-id="'+b.id+'" title="Include in summary and effort"'+(incl?' checked':'')+'></td>'
        +'<td>'+main+'</td>'
        +'<td><div class="hint">'+kids.length+' variation'+(kids.length!==1?'s':'')+'</div><div class="vrow">'+vh+'</div></td>'
        +'<td class="notes"><textarea class="notes-inp" data-id="'+b.id+'" placeholder="Notes…">'+esc(b.notes)+'</textarea></td>'
        +'<td>'+cxsel+'</td><td>'+tysel+'</td>'
        +'<td><input type="text" class="f-core" data-id="'+b.id+'" value="'+esc(b.coreBlockType)+'" placeholder="e.g. Cards"></td>'
        +'<td><input type="text" class="tag-inp" data-id="'+b.id+'" value="'+esc((b.tags||[]).join(', '))+'" placeholder="tag1, tag2"></td></tr>';
    });
    return h+'</tbody></table></div>';
  }

  // ---------- summary + estimate ----------
  function summaryHtml(){
    var sel=effortMains(), shown=displayMains().length;
    var t={Simple:0,Medium:0,Complex:0,Core:0,Custom:0,vars:0};
    sel.forEach(function(b){ t[b.complexity]++; t[b.type]++; t.vars+=childrenOf(b.id).length; });
    var fnote=D.ui.filter.length?(' · filtered by tag: '+esc(D.ui.filter.join(', '))):'';
    var h='<div class="selcount">Including <b>'+sel.length+'</b> of '+shown+' shown block'+(shown!==1?'s':'')+' in the summary &amp; effort'+fnote+'.</div>';
    h+='<div class="hilr-stats"><div class="hilr-stat"><div class="n">'+sel.length+'</div><div class="l">Unique blocks</div></div><div class="hilr-stat"><div class="n">'+t.Core+'</div><div class="l">Core</div></div><div class="hilr-stat"><div class="n">'+t.Custom+'</div><div class="l">Custom</div></div><div class="hilr-stat"><div class="n">'+t.vars+'</div><div class="l">Total variations</div></div><div class="hilr-stat"><div class="n">'+t.Simple+' / '+t.Medium+' / '+t.Complex+'</div><div class="l">Simple / Med / Complex</div></div></div>';
    h+='<div class="hilr-tblwrap"><table class="hilr-t"><thead><tr><th>#</th><th>Consolidated block</th><th>Type</th><th>Variations</th><th>Build complexity</th><th>Tags</th><th>Core type</th></tr></thead><tbody>';
    sel.forEach(function(b,i){ h+='<tr><td class="muted">'+(i+1)+'</td><td><b>'+esc(b.name||'(unnamed)')+'</b> <span class="mono">'+esc(b.internalId)+'</span></td><td><span class="rvbadge '+b.type.toLowerCase()+'">'+b.type+'</span></td><td class="c">'+childrenOf(b.id).length+'</td><td><span class="cxb cx-'+b.complexity.toLowerCase()+'">'+b.complexity+'</span></td><td class="muted">'+esc((b.tags||[]).join(', '))+'</td><td class="muted">'+esc(b.coreBlockType)+'</td></tr>'; });
    if(!sel.length) h+='<tr><td colspan="7" class="muted c">No blocks selected — add a block, tick a checkbox, or adjust the filter above.</td></tr>';
    return h+'</tbody></table></div>';
  }
  function estCounts(){ var c={Core:{Simple:0,Medium:0,Complex:0},Custom:{Simple:0,Medium:0,Complex:0}}; effortMains().forEach(function(b){ if(c[b.type]&&c[b.type][b.complexity]!=null) c[b.type][b.complexity]++; }); return c; }
  function estimateHtml(){
    var c=estCounts(), grand=0;
    var h='<div class="hilr-tblwrap"><table class="hilr-t"><thead><tr><th style="text-align:left">Block type</th><th>Complexity</th><th>Hours / block</th><th>Count</th><th>Total dev hours</th></tr></thead><tbody>';
    TY.forEach(function(t){ CX.forEach(function(cx){ var hrs=+D.hours[t][cx]||0, cnt=c[t][cx], tot=hrs*cnt; grand+=tot; h+='<tr><td style="text-align:left">'+t+'</td><td class="c">'+cx+'</td><td class="c"><input type="number" min="0" step="1" class="hr-inp" data-t="'+t+'" data-c="'+cx+'" value="'+hrs+'"></td><td class="c">'+cnt+'</td><td class="c b">'+tot+'</td></tr>'; }); });
    h+='<tr class="grand"><td colspan="4" style="text-align:right"><b>Total development hours</b></td><td class="c tot">'+grand+'</td></tr></tbody></table></div>';
    h+='<button class="hilr-link hr-reset" type="button">Reset hours to defaults</button> <span class="hint">Counts follow the current grouping, selection and tag filter. Total = hours × count.</span>';
    return h;
  }

  // ---------- render + bind ----------
  function refreshDerived(){ $('#rv-summary').innerHTML=summaryHtml(); $('#rv-estimate').innerHTML=estimateHtml(); bindDerived(); persist(); }
  function refreshAll(){ $('#rv-blocks').innerHTML=blocksTable(); bindBlocks(); refreshDerived(); }
  function refreshHeaderPill(){ var n=(D.engagement.accountName||'').trim(); var pill=$('#rv-acct'); if(pill) pill.textContent=n||'—'; }

  function bindEng(){ $$('.eng-inp').forEach(function(inp){ inp.addEventListener('input', function(){ D.engagement[inp.getAttribute('data-k')]=inp.value; if(inp.getAttribute('data-k')==='accountName') refreshHeaderPill(); persist(); }); }); }
  function bindDerived(){
    $$('.hr-inp').forEach(function(inp){ inp.addEventListener('change', function(){ var n=parseFloat(inp.value); D.hours[inp.getAttribute('data-t')][inp.getAttribute('data-c')]=(isNaN(n)||n<0)?0:n; refreshDerived(); }); });
    var rb=$('.hr-reset'); if(rb) rb.addEventListener('click', function(){ D.hours=JSON.parse(JSON.stringify(D.defaultHours)); refreshDerived(); });
  }
  function armVariation(id){ var b=byId(id); arm({type:'variation',parentId:id}, 'Ready to add a variation to "'+((b&&b.name)||'this block')+'". Press ⌘/Ctrl+V, drop an image, or pick a file.'); }
  function armImage(id){ var b=byId(id); arm({type:'image',id:id}, 'Ready to set the image for "'+((b&&b.name)||'this block')+'". Press ⌘/Ctrl+V, drop an image, or pick a file.'); }

  function bindBlocks(){
    $$('.cx-sel').forEach(function(sel){ sel.addEventListener('change', function(){ byId(sel.getAttribute('data-id')).complexity=sel.value; sel.className='cx-sel cx-'+sel.value.toLowerCase(); refreshDerived(); }); });
    $$('.ty-sel').forEach(function(sel){ sel.addEventListener('change', function(){ byId(sel.getAttribute('data-id')).type=sel.value; refreshDerived(); }); });
    $$('.sel-chk').forEach(function(cb){ cb.addEventListener('change', function(){ byId(cb.getAttribute('data-id')).selected=cb.checked; var tr=cb.closest('tr'); if(tr) tr.className='brow'+(cb.checked?'':' excluded'); refreshDerived(); }); });
    $$('.tag-inp').forEach(function(inp){ inp.addEventListener('change', function(){ byId(inp.getAttribute('data-id')).tags=parseTags(inp.value); refreshAll(); }); });
    $$('.f-name').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).name=inp.value; refreshDerived(); }); });
    $$('.f-id').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).internalId=inp.value; refreshDerived(); }); });
    $$('.f-src').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).sourceUrl=inp.value; syncSrcLink('.src-open',inp.getAttribute('data-id'),inp.value); persist(); }); });
    $$('.f-core').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).coreBlockType=inp.value; refreshDerived(); }); });
    $$('.notes-inp').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).notes=inp.value; persist(); }); });
    $$('.vbn-inp').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).name=inp.value; persist(); }); });
    $$('.vsrc-inp').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).sourceUrl=inp.value; syncSrcLink('.vsrc-open',inp.getAttribute('data-id'),inp.value); persist(); }); });
    $$('.mv-main').forEach(function(sel){ sel.addEventListener('change', function(){ var t=sel.value; if(!t) return; var m=byId(sel.getAttribute('data-id')); var kids=childrenOf(m.id); m.parentId=t; kids.forEach(function(c){ c.parentId=t; }); refreshAll(); }); });
    $$('.mv-var').forEach(function(sel){ sel.addEventListener('change', function(){ var val=sel.value; if(!val) return; var v=byId(sel.getAttribute('data-id')); v.parentId=(val==='__main')?null:val; refreshAll(); }); });
    $$('.del-main').forEach(function(b){ b.addEventListener('click', function(){ deleteBlock(b.getAttribute('data-id')); }); });
    $$('.del-var').forEach(function(b){ b.addEventListener('click', function(){ deleteBlock(b.getAttribute('data-id')); }); });
    $$('.addvar').forEach(function(z){ var id=z.getAttribute('data-id'); z.addEventListener('click', function(){ armVariation(id); fileMode={type:'variation',parentId:id}; $('#hilr-file').click(); }); dropify(z, function(files){ handleFiles(files,{type:'variation',parentId:id}); }); });
    $$('.main-imgdrop').forEach(function(z){ var id=z.getAttribute('data-id'); z.addEventListener('click', function(){ armImage(id); fileMode={type:'image',id:id}; $('#hilr-file').click(); }); dropify(z, function(files){ handleFiles(files,{type:'image',id:id}); }); });
    $$('#rv-blocks .rvzoom').forEach(function(im){ im.addEventListener('click', function(){ openReviewImg(im.getAttribute('src'), im.getAttribute('data-title')); }); });
    var ss=$('#rvSort'); if(ss) ss.addEventListener('change', function(){ D.ui.sort=ss.value; refreshAll(); });
    $$('.rvTf').forEach(function(cb){ cb.addEventListener('change', function(){ var v=cb.value, i=D.ui.filter.indexOf(v); if(cb.checked){ if(i<0) D.ui.filter.push(v); } else if(i>=0) D.ui.filter.splice(i,1); refreshAll(); }); });
    var cf=$('#rvClrFilter'); if(cf) cf.addEventListener('click', function(){ D.ui.filter=[]; refreshAll(); });
  }
  function dropify(el, cb){
    el.addEventListener('dragover', function(e){ e.preventDefault(); e.stopPropagation(); el.classList.add('drag'); });
    el.addEventListener('dragleave', function(e){ e.stopPropagation(); el.classList.remove('drag'); });
    el.addEventListener('drop', function(e){ e.preventDefault(); e.stopPropagation(); el.classList.remove('drag'); cb(e.dataTransfer.files); });
  }

  // ---------- save a copy ----------
  function saveCopy(){
    persist();
    var tag=document.getElementById('__review'); if(tag) tag.textContent=JSON.stringify(D).split('<').join('\\u003c');
    var ids=['side-nav','rv-eng','rv-blocks','rv-summary','rv-estimate'], snap={};
    ids.forEach(function(id){ var n=document.getElementById(id); if(n){ snap[id]=n.innerHTML; n.innerHTML=''; } });
    var out='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    ids.forEach(function(id){ var n=document.getElementById(id); if(n) n.innerHTML=snap[id]; });
    var acct=slug(D.engagement.accountName||'');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));
    a.download='saran-block-review'+(acct?'-'+acct:'')+'.html';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.parentNode&&a.parentNode.removeChild(a); }, 1200);
    toast('Saved a self-contained copy with your changes.');
  }
  function resetAll(){
    if(!confirm('Reset the review back to the automated analysis baseline?\n\nThis discards all your manual changes on this device.')) return;
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    D=seed(); persist(); render(); toast('Reset to analysis baseline.');
  }

  // ---------- top-level render (called once by dashboard on first open) ----------
  function render(){
    var v=$('#view-review');
    v.innerHTML=''
      +'<p class="section-lead">A working canvas for the migration team to <b>manually validate and refine</b> the automated block analysis before it feeds the build. Every block, variation, categorization, complexity rating and effort assumption below is editable. The tool is pre-seeded from the analysis (13 base block families, '+((DATA.galleries||[]).reduce(function(a,g){return a+g.variants.length;},0))+' variants) — re-group, re-classify, exclude noise, add anything the crawler missed, and read off a live effort estimate. Your changes are saved in this browser automatically; use “Save a copy” to hand off a self-contained file.</p>'
      +'<div class="hilr-toolbar">'
        +'<button class="hilr-btn" id="rv-save">💾 Save a copy (with my changes)</button>'
        +'<button class="hilr-link" id="rv-print">🖨 Print / Save as PDF</button>'
        +'<button class="hilr-link" id="rv-addblank">➕ Add empty block</button>'
        +'<button class="hilr-link danger" id="rv-reset">↺ Reset to analysis baseline</button>'
        +'<span class="hilr-note"><b>Copy a screenshot</b> (Win+Shift+S / ⌘⌃⇧4) then press <b>⌘/Ctrl+V</b> anywhere to add it as a new main block. Attach <b>variations</b> to a block, <b>split</b> a variation into its own block, move blocks around, tag and filter, include/exclude from the estimate, and edit every field. The consolidation summary and effort estimate recompute live.</span>'
      +'</div>'
      +'<div class="hilr-armbar" id="hilr-armbar"><span id="hilr-armtext"></span><button id="hilr-armcancel" type="button">Cancel (Esc)</button></div>'
      +'<div class="hilr-panel"><h3>Engagement details</h3><div class="cap">Captured separately from the analysis — fill in for this specific customer engagement.</div><div id="rv-eng"></div></div>'
      +'<div class="hilr-drop" id="hilr-drop"><div>📋 <b>Paste a screenshot</b> (⌘/Ctrl+V), drop images here, or click to choose files.</div><div class="dz-sub">Each image becomes a new main block. You can add variations to any block below.</div></div>'
      +'<input type="file" id="hilr-file" accept="image/*" multiple style="display:none">'
      +'<div class="hilr-panel"><h3>Blocks &amp; variations</h3><div class="cap">Consolidated reusable UI blocks, their variations, source URLs, build complexity and type. Edit anything.</div><div id="rv-blocks"></div></div>'
      +'<div class="hilr-panel"><h3>Consolidation summary</h3><div class="cap">Live rollup of the blocks currently included above.</div><div id="rv-summary"></div></div>'
      +'<div class="hilr-panel"><h3>Development effort estimate</h3><div class="cap">Adjust the hours per block/complexity; totals follow your grouping and selection.</div><div id="rv-estimate"></div></div>';
    $('#rv-eng').innerHTML=engHtml(); bindEng();
    refreshAll();
    // wire toolbar + dropzone
    $('#rv-save').onclick=saveCopy;
    $('#rv-print').onclick=function(){ window.print(); };
    $('#rv-addblank').onclick=function(){ addMainData(''); persist(); refreshAll(); toast('Empty block added — paste or drop its image.'); };
    $('#rv-reset').onclick=resetAll;
    $('#hilr-armcancel').onclick=disarm;
    var dz=$('#hilr-drop');
    dz.addEventListener('click', function(){ disarm(); fileMode=null; $('#hilr-file').click(); });
    dropify(dz, function(files){ handleFiles(files,{}); });
    $('#hilr-file').addEventListener('change', function(){ var mode=fileMode||{}; handleFiles(this.files, mode); this.value=''; });
  }

  // global clipboard paste — only act when the Review view is active
  document.addEventListener('paste', function(e){
    var view=$('#view-review'); if(!view || !view.classList.contains('active')) return;
    var files=collectImageFiles(e.clipboardData && e.clipboardData.files);
    if(!files.length && e.clipboardData && e.clipboardData.items){
      for(var i=0;i<e.clipboardData.items.length;i++){ var it=e.clipboardData.items[i]; if(it.kind==='file' && /^image\//.test(it.type)){ var f=it.getAsFile(); if(f) files.push(f); } }
    }
    if(!files.length) return;
    e.preventDefault();
    handleFiles(files, pasteTarget||{});
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') disarm(); });

  // expose a single entry point for the dashboard renderer
  load();
  window.__renderReview=render;
})();

</script>
</body>
</html>
