<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>lifree.kr — Site Analysis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Source+Sans+3:wght@400;500;600;700&family=Source+Code+Pro:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#EEEDE7; --panel:#FFFFFF; --panel-2:#F7F6F1;
  --ink:#17181C; --muted:#656C79; --faint:#9AA0AB;
  --line:#DCDAD1; --line-soft:#E7E5DD;
  --shell:#161A22; --shell-2:#1F2530; --shell-line:#2C3340; --shell-ink:#C4CAD6; --shell-faint:#79818F;
  --accent:#EB1000; --accent-2:#FA5A4B; --accent-wash:#FCE7E4;
  --amber:#D88A22; --amber-wash:#FBEFDC;
  --green:#1E8A5C; --green-wash:#E1F0E9;
  --custom:#B96C22; --custom-wash:#F6E9DA;
  --danger:#BE3A2E;
  --r:10px; --r-lg:16px;
  --sh:0 1px 2px rgba(20,22,28,.04),0 4px 16px rgba(20,22,28,.05);
  --sh-lg:0 8px 40px rgba(20,22,28,.14);
  --sans:'adobe-clean','Source Sans 3',system-ui,sans-serif;
  --disp:'adobe-clean','Source Sans 3',system-ui,sans-serif;
  --mono:'adobe-clean-mono','Source Code Pro',ui-monospace,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{font-family:var(--sans);background:var(--paper);color:var(--ink);
  font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased;font-feature-settings:"cv05","ss01"}
a{color:inherit;text-decoration:none}
::selection{background:var(--accent);color:#fff}
h1,h2,h3,h4{font-family:var(--disp);font-weight:600;letter-spacing:-.01em;line-height:1.15}
.app{display:grid;grid-template-columns:264px 1fr;min-height:100vh;transition:grid-template-columns .2s ease}
.app.nav-collapsed{grid-template-columns:0 1fr}
.app.nav-collapsed>.sidebar{transform:translateX(-100%);opacity:0;pointer-events:none;transition:transform .2s ease,opacity .18s ease}
.app.nav-collapsed .view-wrap{max-width:none}
.scrim{display:none}
.sidebar{position:sticky;top:0;height:100vh;background:var(--shell);color:var(--shell-ink);
  display:flex;flex-direction:column;border-right:1px solid var(--shell-line);z-index:40}
.brand{padding:20px 22px 18px;border-bottom:1px solid var(--shell-line)}
.adobe-lockup{display:flex;align-items:center;gap:9px;margin-bottom:16px}
.adobe-mark{width:24px;height:21px;display:block}
.adobe-word{font-family:var(--disp);font-weight:700;font-size:17px;color:#fff;letter-spacing:-.01em}
.brand .eyebrow{font-family:var(--mono);font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--shell-faint)}
.brand h1{font-size:19px;color:#fff;margin-top:9px;line-height:1.1}
.brand .site{font-family:var(--mono);font-size:11.5px;color:var(--accent-2);margin-top:7px;word-break:break-all}
.brand .status{display:inline-flex;align-items:center;gap:6px;margin-top:12px;font-size:11px;font-weight:600;color:#7FE0AE;font-family:var(--mono);letter-spacing:.04em}
.brand .status .dot{width:7px;height:7px;border-radius:50%;background:#3FCB86;box-shadow:0 0 0 3px rgba(63,203,134,.18)}
nav.side-nav{padding:12px 12px 16px;overflow-y:auto;flex:1}
.nav-label{font-family:var(--mono);font-size:9.5px;letter-spacing:.15em;text-transform:uppercase;color:var(--shell-faint);padding:12px 12px 6px}
.nav-item{display:flex;align-items:center;gap:11px;width:100%;padding:9px 12px;border:none;background:none;color:var(--shell-ink);font-family:var(--sans);font-size:13.5px;font-weight:500;cursor:pointer;border-radius:8px;text-align:left;transition:background .12s,color .12s}
.nav-item .idx{font-family:var(--mono);font-size:11px;color:var(--shell-faint);width:16px;flex:none}
.nav-item:hover{background:var(--shell-2);color:#fff}
.nav-item.active{background:var(--accent);color:#fff}
.nav-item.active .idx{color:rgba(255,255,255,.72)}
.nav-item .count{margin-left:auto;font-family:var(--mono);font-size:10.5px;color:var(--shell-faint);background:rgba(255,255,255,.05);padding:2px 7px;border-radius:20px}
.nav-item.active .count{color:#fff;background:rgba(255,255,255,.16)}
.side-foot{padding:14px 22px;border-top:1px solid var(--shell-line);font-family:var(--mono);font-size:10.5px;color:var(--shell-faint);line-height:1.6}
.main{min-width:0;display:flex;flex-direction:column}
.topbar{position:sticky;top:0;background:rgba(238,237,231,.82);backdrop-filter:blur(12px);border-bottom:1px solid var(--line);padding:16px 34px;z-index:30;display:flex;align-items:center;gap:16px}
.topbar .crumb{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted)}
.topbar h2{font-size:17px}
.topbar .spacer{flex:1}
.topbar .meta-pill{font-family:var(--mono);font-size:11px;color:var(--muted);padding:6px 12px;background:var(--panel);border:1px solid var(--line);border-radius:20px}
.menu-btn{display:none}
.nav-toggle{display:flex;align-items:center;justify-content:center;width:36px;height:36px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer;flex:none}
.nav-toggle svg{width:17px;height:17px;stroke:var(--ink);fill:none;stroke-width:2}
.nav-toggle:hover{border-color:var(--accent)}
.nav-toggle:hover svg{stroke:var(--accent)}
.brand-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.brand-head .bh-txt{min-width:0}
.brand-edit{flex:none;background:none;border:1px solid var(--shell-line);color:var(--shell-faint);width:27px;height:27px;border-radius:7px;cursor:pointer;font-size:12.5px;display:flex;align-items:center;justify-content:center;margin-top:1px;transition:color .12s,border-color .12s}
.brand-edit:hover{color:#fff;border-color:var(--accent-2)}
.brand h1[contenteditable="true"],.brand .eyebrow[contenteditable="true"]{outline:1px dashed var(--accent-2);border-radius:5px;padding:2px 5px;cursor:text;background:rgba(255,255,255,.04)}
.spec-url a{color:var(--accent);text-decoration:none}
.spec-url a:hover{text-decoration:underline}
.view-wrap{padding:34px;max-width:1420px;width:100%}
.view{display:none;animation:fade .32s ease}
.view.active{display:block}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto}}
.section-lead{max-width:760px;color:var(--muted);font-size:15px;line-height:1.6;margin:2px 0 26px}
.block-title{display:flex;align-items:baseline;gap:12px;margin:38px 0 16px}
.block-title h3{font-size:19px}
.block-title .tag{font-family:var(--mono);font-size:11px;color:var(--faint)}
.hr{height:1px;background:var(--line-soft);border:none;margin:30px 0}
.hero{background:var(--shell);color:#fff;border-radius:var(--r-lg);padding:34px 36px;margin-bottom:26px;position:relative;overflow:hidden}
.hero::after{content:"";position:absolute;inset:0;background:radial-gradient(680px 340px at 100% -10%,rgba(88,102,214,.32),transparent 60%),radial-gradient(420px 300px at -5% 120%,rgba(216,138,34,.14),transparent 60%);pointer-events:none}
.hero .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8E97F0}
.hero h2{font-size:30px;color:#fff;margin:12px 0 6px;max-width:22ch;position:relative}
.hero .sub{color:var(--shell-ink);max-width:70ch;position:relative;font-size:14.5px}
.hero .facts{display:flex;flex-wrap:wrap;gap:22px;margin-top:22px;position:relative}
.hero .fact{font-family:var(--mono);font-size:12px;color:var(--shell-ink)}
.hero .fact b{color:#fff;font-weight:600}
.kpis{display:grid;grid-template-columns:repeat(6,1fr);gap:14px;margin-bottom:14px}
.kpi{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:18px 18px 16px;box-shadow:var(--sh);position:relative;overflow:hidden}
.kpi .n{font-family:var(--disp);font-size:30px;font-weight:600;letter-spacing:-.02em;line-height:1}
.kpi .l{font-size:11.5px;color:var(--muted);margin-top:8px;font-weight:500}
.kpi .bar{position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--accent)}
.kpi.amber .bar{background:var(--amber)} .kpi.green .bar{background:var(--green)}
.kpi.custom .bar{background:var(--custom)} .kpi.ink .bar{background:var(--ink)}
.grid{display:grid;gap:16px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.panel-pad{padding:22px 24px}
.panel h4{font-size:15px;margin-bottom:4px}
.panel .cap{font-size:12px;color:var(--muted);margin-bottom:14px}
.two-col{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
.findings{list-style:none;display:flex;flex-direction:column;gap:12px}
.findings li{display:flex;gap:13px;font-size:13.5px;line-height:1.55;color:#2C2F38}
.findings .mk{font-family:var(--mono);font-size:11px;color:var(--accent);font-weight:600;flex:none;margin-top:2px;width:20px}
.stat-list{width:100%;border-collapse:collapse}
.stat-list td{padding:10px 4px;border-bottom:1px solid var(--line-soft);font-size:13px}
.stat-list tr:last-child td{border-bottom:none}
.stat-list td:first-child{color:var(--muted)}
.stat-list td:last-child{text-align:right;font-family:var(--mono);font-weight:500}
.stat-list td:last-child.hl{color:var(--accent)}
.tbl-wrap{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh)}
.tbl-scroll{overflow-x:auto}
table.data{width:100%;border-collapse:collapse;font-size:13px}
table.data th{background:var(--panel-2);text-align:left;padding:12px 16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:600;border-bottom:1px solid var(--line);position:sticky;top:0;white-space:nowrap}
table.data td{padding:12px 16px;border-bottom:1px solid var(--line-soft);vertical-align:top}
table.data tr:last-child td{border-bottom:none}
table.data tbody tr{transition:background .1s}
table.data tbody tr:hover{background:var(--panel-2)}
.mono{font-family:var(--mono)}
.num{font-family:var(--mono);text-align:right;font-variant-numeric:tabular-nums}
.name-cell{font-family:var(--mono);font-weight:500;font-size:12.5px}
.desc-cell{color:var(--muted);max-width:420px;font-size:12.5px;line-height:1.5}
.url-cell{font-family:var(--mono);font-size:11.5px;color:var(--accent);word-break:break-all}
.url-cell:hover{text-decoration:underline}
.chips{display:flex;flex-wrap:wrap;gap:5px}
.chip{font-family:var(--mono);font-size:10.5px;padding:2px 8px;border-radius:20px;background:var(--panel-2);border:1px solid var(--line);color:var(--muted);white-space:nowrap}
.chip.k{background:var(--accent-wash);border-color:transparent;color:var(--accent)}
.badge{display:inline-flex;align-items:center;gap:5px;font-family:var(--mono);font-size:11px;font-weight:600;padding:3px 9px;border-radius:20px}
.badge.yes{background:var(--green-wash);color:var(--green)}
.badge.custom{background:var(--custom-wash);color:var(--custom)}
.rank{font-family:var(--mono);font-size:12px;color:var(--faint);font-weight:600}
.mini-bar{height:6px;border-radius:6px;background:var(--line-soft);overflow:hidden;min-width:80px}
.mini-bar i{display:block;height:100%;background:var(--accent);border-radius:6px}
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:16px}
.search{position:relative;flex:1;min-width:220px;max-width:380px}
.search input{width:100%;padding:10px 14px 10px 36px;border:1px solid var(--line);border-radius:9px;background:var(--panel);font-family:var(--sans);font-size:13px;color:var(--ink)}
.search input:focus{outline:2px solid var(--accent);outline-offset:1px;border-color:transparent}
.search svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:15px;height:15px;stroke:var(--faint);fill:none;stroke-width:2}
.count-note{font-family:var(--mono);font-size:11.5px;color:var(--muted)}
.type-rail{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:22px}
.type-btn{display:flex;align-items:center;gap:8px;padding:8px 13px;border:1px solid var(--line);background:var(--panel);border-radius:9px;cursor:pointer;font-family:var(--sans);font-size:13px;font-weight:500;color:var(--ink);transition:all .12s;box-shadow:var(--sh)}
.type-btn:hover{border-color:var(--accent);color:var(--accent)}
.type-btn.active{background:var(--accent);border-color:var(--accent);color:#fff}
.type-btn .c{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:20px;background:var(--panel-2);color:var(--muted)}
.type-btn.active .c{background:rgba(255,255,255,.18);color:#fff}
.type-btn.eds-custom.active{background:var(--custom);border-color:var(--custom)}
.gallery-head{display:flex;flex-wrap:wrap;align-items:center;gap:14px;margin-bottom:6px}
.gallery-head h3{font-size:22px}
.trait-strip{display:flex;flex-wrap:wrap;gap:6px;margin:14px 0 20px}
.trait-pill{font-family:var(--mono);font-size:11px;padding:4px 10px;border-radius:20px;background:var(--panel);border:1px solid var(--line);color:var(--muted)}
.trait-pill b{color:var(--ink);font-weight:600}
.specimens{display:grid;grid-template-columns:repeat(auto-fill,minmax(232px,1fr));gap:16px}
.specimen{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);cursor:pointer;transition:transform .14s,box-shadow .14s,border-color .14s;display:flex;flex-direction:column}
.specimen:hover{transform:translateY(-3px);box-shadow:var(--sh-lg);border-color:var(--accent)}
.specimen:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.shot{position:relative;background:repeating-conic-gradient(#f1efe8 0% 25%,#e9e7de 0% 50%) 0 0/16px 16px;aspect-ratio:16/10;overflow:hidden;display:flex;align-items:flex-start;justify-content:center;border-bottom:1px solid var(--line-soft)}
.shot img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.shot .expand{position:absolute;top:8px;right:8px;width:26px;height:26px;border-radius:7px;background:rgba(22,26,34,.72);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .14s}
.specimen:hover .shot .expand{opacity:1}
.shot .expand svg{width:14px;height:14px;stroke:#fff;fill:none;stroke-width:2}
.shot .pgcount{position:absolute;left:8px;bottom:8px;font-family:var(--mono);font-size:10.5px;font-weight:600;color:#fff;background:rgba(22,26,34,.72);padding:3px 8px;border-radius:20px}
.spec-body{padding:12px 13px 13px;display:flex;flex-direction:column;gap:8px;flex:1}
.spec-id{font-family:var(--mono);font-size:12px;font-weight:600;line-height:1.35;word-break:break-word}
.spec-traits{display:flex;flex-wrap:wrap;gap:4px}
.spec-traits .t{font-family:var(--mono);font-size:9.5px;text-transform:uppercase;letter-spacing:.04em;padding:2px 7px;border-radius:5px;background:var(--panel-2);color:var(--muted)}
.spec-url{font-family:var(--mono);font-size:10.5px;color:var(--faint);word-break:break-all;margin-top:auto}
.empty-shot{display:flex;align-items:center;justify-content:center;height:100%;color:var(--faint);font-family:var(--mono);font-size:11px}
.lb{position:fixed;inset:0;background:rgba(16,18,24,.86);backdrop-filter:blur(4px);z-index:100;display:none;align-items:center;justify-content:center;padding:32px}
.lb.open{display:flex;animation:fade .2s ease}
.lb-card{background:var(--panel);border-radius:var(--r-lg);max-width:1000px;width:100%;max-height:92vh;overflow:hidden;display:grid;grid-template-columns:1.55fr .95fr;box-shadow:var(--sh-lg)}
.lb-img{background:#0F1116;display:flex;align-items:center;justify-content:center;overflow:auto;padding:20px}
.lb-img img{max-width:100%;height:auto;border-radius:6px;box-shadow:0 8px 30px rgba(0,0,0,.4)}
.lb-info{padding:26px 26px;display:flex;flex-direction:column;overflow-y:auto}
.lb-info .kicker{font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);margin-bottom:10px}
.lb-info h3{font-family:var(--mono);font-size:16px;font-weight:600;line-height:1.35;word-break:break-word}
.lb-meta{margin-top:20px;display:flex;flex-direction:column;gap:14px}
.lb-row .lab{font-family:var(--mono);font-size:10px;letter-spacing:.1em;text-transform:uppercase;color:var(--faint);margin-bottom:5px}
.lb-row .val{font-size:13.5px;line-height:1.5}
.lb-row .val.mono{font-family:var(--mono);font-size:12.5px}
.lb-traits{display:flex;flex-wrap:wrap;gap:6px}
.lb-traits .t{font-family:var(--mono);font-size:11px;padding:3px 9px;border-radius:6px;background:var(--accent-wash);color:var(--accent)}
.lb-src{margin-top:auto;padding-top:20px}
.lb-src a{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:600;padding:9px 14px;border:1px solid var(--accent);border-radius:8px;transition:background .12s}
.lb-src a:hover{background:var(--accent);color:#fff}
.lb-close{position:absolute;top:20px;right:22px;width:38px;height:38px;border-radius:10px;border:none;background:rgba(255,255,255,.1);color:#fff;font-size:20px;cursor:pointer;z-index:2;display:flex;align-items:center;justify-content:center;transition:background .12s}
.lb-close:hover{background:rgba(255,255,255,.22)}
.lb-nav{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;border:none;background:rgba(255,255,255,.12);color:#fff;cursor:pointer;font-size:20px;z-index:2;display:flex;align-items:center;justify-content:center;transition:background .12s}
.lb-nav:hover{background:rgba(255,255,255,.24)}
.lb-nav.prev{left:22px} .lb-nav.next{right:22px}
.lb-counter{position:absolute;bottom:22px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:12px;color:rgba(255,255,255,.8);background:rgba(16,18,24,.6);padding:6px 14px;border-radius:20px;z-index:2}
.heat-toggle{display:inline-flex;background:var(--panel-2);border:1px solid var(--line);border-radius:8px;padding:3px;gap:2px;margin-bottom:16px}
.heat-toggle button{border:none;background:none;padding:7px 14px;border-radius:6px;cursor:pointer;font-family:var(--mono);font-size:12px;color:var(--muted);font-weight:500}
.heat-toggle button.active{background:var(--panel);color:var(--ink);box-shadow:var(--sh)}
.heat-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh)}
table.heat{border-collapse:collapse;font-size:12px;width:100%}
table.heat th{font-family:var(--mono);font-size:10px;letter-spacing:.03em;padding:11px 8px;font-weight:600;color:var(--muted);border-bottom:1px solid var(--line);white-space:nowrap;background:var(--panel-2)}
table.heat th.tmpl,table.heat td.tmpl{text-align:left;position:sticky;left:0;background:var(--panel);z-index:1}
table.heat th.tmpl{z-index:2}
table.heat td{text-align:center;padding:0;border-bottom:1px solid var(--line-soft);font-family:var(--mono);font-size:11px;font-variant-numeric:tabular-nums}
table.heat td.tmpl{font-family:var(--mono);font-size:11.5px;padding:8px 12px;color:var(--ink);white-space:nowrap;font-weight:500;border-right:1px solid var(--line)}
table.heat td.pg{color:var(--muted);padding:0 8px}
.cell-v{display:flex;align-items:center;justify-content:center;height:34px;margin:2px;border-radius:5px}
.acc{border:1px solid var(--line);border-radius:var(--r);overflow:hidden;margin-bottom:10px;background:var(--panel);box-shadow:var(--sh)}
.acc summary{padding:14px 18px;cursor:pointer;display:flex;align-items:center;gap:12px;font-weight:500;font-size:13.5px;list-style:none;user-select:none}
.acc summary::-webkit-details-marker{display:none}
.acc summary .caret{font-family:var(--mono);color:var(--faint);transition:transform .15s;font-size:11px}
.acc[open] summary .caret{transform:rotate(90deg)}
.acc summary .grp{font-family:var(--mono);color:var(--accent);font-weight:600}
.acc summary .n{margin-left:auto;font-family:var(--mono);font-size:11px;color:var(--muted);background:var(--panel-2);padding:2px 9px;border-radius:20px}
.acc .body{padding:4px 18px 16px;border-top:1px solid var(--line-soft)}
.url-list{list-style:none;columns:2;column-gap:32px}
.url-list li{font-family:var(--mono);font-size:11.5px;padding:5px 0;color:var(--accent);word-break:break-all;break-inside:avoid}
.url-list li:hover{text-decoration:underline}
.doc-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:10px}
.doc{display:flex;align-items:center;gap:12px;padding:13px 15px;background:var(--panel);border:1px solid var(--line);border-radius:9px;box-shadow:var(--sh);transition:border-color .12s}
.doc:hover{border-color:var(--accent)}
.doc .ext{font-family:var(--mono);font-size:10px;font-weight:700;padding:5px 8px;border-radius:6px;flex:none;background:var(--danger);color:#fff;letter-spacing:.03em}
.doc .ext.xls{background:var(--green)} .doc .ext.doc{background:var(--accent)} .doc .ext.zip{background:var(--custom)}
.doc .path{font-family:var(--mono);font-size:11.5px;color:var(--ink);word-break:break-all;line-height:1.4}
.doc .path .dim{color:var(--faint)}
.rec-list{display:flex;flex-direction:column;gap:12px}
.rec{display:flex;gap:16px;padding:18px 20px;background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh)}
.rec .no{font-family:var(--disp);font-size:22px;font-weight:600;color:var(--accent);flex:none;width:34px;line-height:1}
.rec .txt{font-size:13.5px;line-height:1.55}
.rec .txt b{font-weight:600}
.note-list{list-style:none;display:flex;flex-direction:column;gap:11px}
.note-list li{display:flex;gap:12px;font-size:13px;line-height:1.55;color:#33363F}
.note-list .mk{color:var(--accent);flex:none;font-family:var(--mono);font-size:12px;margin-top:2px}
.mth-hero{background:linear-gradient(135deg,var(--shell) 0%,#20283A 100%);color:#fff;border-radius:var(--r-lg);padding:32px 34px;margin-bottom:24px;position:relative;overflow:hidden}
.mth-hero::after{content:"";position:absolute;inset:0;background:radial-gradient(600px 300px at 108% 0%,rgba(88,102,214,.34),transparent 62%);pointer-events:none}
.mth-hero .eyebrow{font-family:var(--mono);font-size:11px;letter-spacing:.16em;text-transform:uppercase;color:#8E97F0}
.mth-hero h2{font-size:26px;color:#fff;margin:11px 0 10px;max-width:26ch;position:relative}
.mth-hero p{color:var(--shell-ink);max-width:74ch;position:relative;font-size:14.5px;line-height:1.6}
.mth-hero .qs{display:flex;flex-wrap:wrap;gap:10px;margin-top:20px;position:relative}
.mth-hero .q{font-family:var(--mono);font-size:12px;color:#fff;background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.12);padding:9px 14px;border-radius:9px}
.mth-hero .q b{color:#8E97F0;font-weight:600}
.one-liner{display:flex;gap:16px;align-items:flex-start;background:var(--accent-wash);border:1px solid #C9CEF6;border-left:4px solid var(--accent);border-radius:var(--r);padding:20px 22px;margin-bottom:14px}
.one-liner .ic{font-family:var(--mono);font-weight:700;color:var(--accent);font-size:13px;letter-spacing:.06em;text-transform:uppercase;flex:none;padding-top:2px}
.one-liner p{font-size:15px;line-height:1.6;color:#20242E}
.tip-bar{display:flex;gap:12px;align-items:center;background:var(--amber-wash);border:1px solid #EBD3A8;border-radius:var(--r);padding:13px 18px;font-size:13.5px;color:#6B4A16;margin-bottom:30px}
.tip-bar .ic{font-size:16px}.tip-bar b{font-weight:600}
.mth-section{margin:36px 0 0}
.mth-h{display:flex;align-items:baseline;gap:12px;margin-bottom:6px}
.mth-h .step{font-family:var(--mono);font-size:12px;font-weight:600;color:#fff;background:var(--accent);padding:3px 9px;border-radius:6px;flex:none}
.mth-h h3{font-size:20px}
.mth-p{color:var(--muted);font-size:14px;line-height:1.6;max-width:80ch;margin:8px 0 4px}
.flow{display:grid;grid-template-columns:repeat(7,1fr);gap:0;margin:10px 0 6px;position:relative}
.flow .node{position:relative;padding:0 8px}
.flow .node .card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 14px;box-shadow:var(--sh);height:100%;transition:transform .14s,border-color .14s}
.flow .node .card:hover{transform:translateY(-3px);border-color:var(--accent)}
.flow .node .num{width:26px;height:26px;border-radius:7px;background:var(--accent-wash);color:var(--accent);font-family:var(--mono);font-weight:600;font-size:13px;display:flex;align-items:center;justify-content:center;margin-bottom:11px}
.flow .node .st{font-family:var(--disp);font-weight:600;font-size:13.5px;line-height:1.25;margin-bottom:7px}
.flow .node .wt{font-size:11.5px;color:var(--muted);line-height:1.45}
.flow .node:not(:last-child) .card::after{content:"→";position:absolute;right:-9px;top:50%;transform:translateY(-50%);color:var(--faint);font-size:15px;z-index:2;background:var(--paper);width:18px;height:18px;display:flex;align-items:center;justify-content:center;border-radius:50%}
.ex-callout{display:flex;gap:14px;align-items:flex-start;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:14px 18px;margin-top:14px}
.ex-callout .tag{font-family:var(--mono);font-size:10px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--green);background:var(--green-wash);padding:4px 9px;border-radius:6px;flex:none}
.ex-callout p{font-size:13px;line-height:1.55;color:#33363F}
.mini-list{list-style:none;display:flex;flex-wrap:wrap;gap:8px;margin:12px 0 4px}
.mini-list li{font-family:var(--mono);font-size:12px;background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 13px;display:flex;align-items:center;gap:9px}
.mini-list li .n{color:var(--accent);font-weight:600}
.cascade{display:flex;flex-direction:column;gap:8px;margin:14px 0 6px}
.tier{display:grid;grid-template-columns:56px 1fr 1.1fr;align-items:stretch;background:var(--panel);border:1px solid var(--line);border-radius:10px;overflow:hidden;box-shadow:var(--sh)}
.tier .tn{background:var(--panel-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:18px;font-weight:600;color:var(--muted);border-right:1px solid var(--line)}
.tier .sig{padding:13px 16px;border-right:1px solid var(--line-soft)}
.tier .sig .lab{font-weight:600;font-size:13.5px;margin-bottom:3px}
.tier .sig .ex,.tier .exwrap .ex{font-family:var(--mono);font-size:11.5px;color:var(--muted);line-height:1.5;word-break:break-word}
.tier.fallback{border-color:var(--custom)}
.tier.fallback .tn{background:var(--custom-wash);color:var(--custom)}
.tier .exwrap{display:flex;align-items:center;padding:13px 16px}
.tax-note{display:flex;gap:12px;align-items:flex-start;margin-top:14px;font-size:12.5px;color:var(--muted);line-height:1.55;background:var(--panel-2);border:1px solid var(--line-soft);border-radius:9px;padding:13px 16px}
.tax-note .ic{color:var(--accent);flex:none;font-family:var(--mono)}
.term{font-family:var(--mono);font-size:11px;padding:2px 8px;border-radius:5px;background:var(--accent-wash);color:var(--accent);display:inline-block;margin:2px 2px 0 0}
.weights{display:flex;flex-direction:column;gap:9px;margin:14px 0 4px}
.wrow{display:grid;grid-template-columns:160px 1fr 52px;gap:14px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:9px;padding:12px 16px;box-shadow:var(--sh)}
.wrow .wc{font-weight:600;font-size:13px;font-family:var(--mono)}
.wrow .wtrack{height:10px;background:var(--line-soft);border-radius:6px;overflow:hidden}
.wrow .wtrack i{display:block;height:100%;background:linear-gradient(90deg,var(--accent),var(--accent-2));border-radius:6px}
.wrow .wv{font-family:var(--mono);font-weight:600;font-size:13px;text-align:right;color:var(--accent)}
.wrow .wwhen{grid-column:1/-1;font-size:12px;color:var(--muted);line-height:1.4;margin-top:-2px}
.thresh{display:inline-flex;align-items:center;gap:8px;font-family:var(--mono);font-size:12.5px;font-weight:600;color:var(--green);background:var(--green-wash);padding:8px 14px;border-radius:8px;margin-top:12px}
.two-step{display:grid;grid-template-columns:1fr 1fr;gap:14px;margin:14px 0}
.step-card{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:18px 20px;box-shadow:var(--sh)}
.step-card .k{font-family:var(--mono);font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--accent);margin-bottom:8px}
.step-card h4{font-size:14.5px;margin-bottom:7px}
.step-card p{font-size:13px;color:var(--muted);line-height:1.55}
.id-format{font-family:var(--mono);font-size:13px;background:var(--shell);color:#fff;padding:16px 20px;border-radius:10px;margin-top:14px;line-height:1.7;word-break:break-word}
.id-format b{color:#8E97F0}
.examples-grid{display:grid;grid-template-columns:1fr 1fr;gap:18px;margin-top:16px}
.ex-diagram{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);overflow:hidden;box-shadow:var(--sh);display:flex;flex-direction:column}
.ex-diagram .head{padding:16px 20px 14px;border-bottom:1px solid var(--line-soft)}
.ex-diagram .head .badge{margin-bottom:9px}
.ex-diagram .head h4{font-size:15px;line-height:1.3}
.ex-diagram .head p{font-size:12.5px;color:var(--muted);margin-top:7px;line-height:1.5}
.ex-diagram .imgwrap{position:relative;cursor:zoom-in;background:var(--panel-2);padding:14px;border-bottom:1px solid var(--line-soft)}
.ex-diagram .imgwrap img{width:100%;border-radius:6px;display:block;box-shadow:var(--sh)}
.ex-diagram .imgwrap .expand{position:absolute;top:20px;right:20px;width:30px;height:30px;border-radius:8px;background:rgba(22,26,34,.72);display:flex;align-items:center;justify-content:center;opacity:0;transition:opacity .14s}
.ex-diagram .imgwrap:hover .expand{opacity:1}
.ex-diagram .imgwrap .expand svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.ex-diagram .reading{padding:15px 20px;font-size:12.5px;line-height:1.55;color:#33363F}
.ex-diagram .reading b{font-family:var(--mono);color:var(--accent);font-weight:600}
.contrast{display:flex;gap:14px;align-items:flex-start;background:var(--shell);color:#fff;border-radius:var(--r);padding:20px 24px;margin-top:18px}
.contrast .ic{font-size:20px;flex:none}
.contrast .lab{font-family:var(--mono);font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:#8E97F0;margin-bottom:6px}
.contrast p{font-size:14px;line-height:1.6;color:var(--shell-ink)}
.caveats{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:6px}
.caveat{display:flex;gap:13px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px 18px;box-shadow:var(--sh)}
.caveat .ic{width:28px;height:28px;border-radius:7px;background:var(--amber-wash);color:var(--custom);flex:none;display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-weight:700;font-size:13px}
.caveat .ct b{font-weight:600}.caveat .ct{font-size:13px;line-height:1.5}
.bottom-line{display:flex;gap:14px;background:var(--green-wash);border:1px solid #B5DCC7;border-left:4px solid var(--green);border-radius:var(--r);padding:20px 24px;margin-top:16px}
.bottom-line .ic{color:var(--green);font-weight:700;font-family:var(--mono);font-size:12px;letter-spacing:.06em;text-transform:uppercase;flex:none;padding-top:2px}
.bottom-line p{font-size:14.5px;line-height:1.6;color:#1E3A2C}
.lb.solo .lb-nav,.lb.solo .lb-counter{display:none}
.lb.solo .lb-card{grid-template-columns:1fr;max-width:720px}
.lb.solo .lb-img{max-height:86vh}
.lb.tallshot .lb-card{max-width:900px;max-height:92vh;display:block;overflow:hidden}
.lb.tallshot .lb-img{display:block;overflow-y:auto;max-height:82vh;background:#0F1116;text-align:center}
.lb.tallshot .lb-img img{max-width:100%;border-radius:4px}
.tpl-thumb{position:relative;width:64px;height:44px;border-radius:6px;overflow:hidden;border:1px solid var(--line);cursor:zoom-in;background:var(--panel-2)}
.tpl-thumb img{width:100%;height:100%;object-fit:cover;object-position:top center;display:block}
.tpl-thumb .mag{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(22,26,34,.55);opacity:0;transition:opacity .12s}
.tpl-thumb:hover .mag{opacity:1}
.tpl-thumb .mag svg{width:15px;height:15px;stroke:#fff;fill:none;stroke-width:2}
.tpl-thumb.empty{display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:9px;color:var(--faint);cursor:default}
.tpl-thumb:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media(max-width:1100px){.kpis{grid-template-columns:repeat(3,1fr)}.two-col{grid-template-columns:1fr}
  .lb-card{grid-template-columns:1fr;max-height:90vh}.lb-img{max-height:46vh}
  .flow{grid-template-columns:repeat(2,1fr);gap:12px}.flow .node .card::after{display:none}
  .examples-grid,.two-step,.caveats{grid-template-columns:1fr}}
@media(max-width:820px){
  .app{grid-template-columns:1fr}
  .tier{grid-template-columns:44px 1fr}.tier .exwrap{grid-column:1/-1;border-top:1px solid var(--line-soft)}
  .wrow{grid-template-columns:1fr 1fr}
  .sidebar{position:fixed;left:0;top:0;bottom:0;width:270px;transform:translateX(-100%);transition:transform .22s}
  .sidebar.open{transform:none}
  .menu-btn{display:flex;align-items:center;justify-content:center;width:38px;height:38px;border-radius:9px;border:1px solid var(--line);background:var(--panel);cursor:pointer}
  .menu-btn svg{width:18px;height:18px;stroke:var(--ink);fill:none;stroke-width:2}
  .nav-toggle{display:none}
  .app.nav-collapsed{grid-template-columns:1fr}
  .app.nav-collapsed>.sidebar{transform:translateX(-100%);opacity:1}
  .view-wrap{padding:20px}.topbar{padding:14px 20px}
  .kpis{grid-template-columns:repeat(2,1fr)}
  .scrim{position:fixed;inset:0;background:rgba(0,0,0,.4);z-index:35;display:none}
  .scrim.show{display:block}
  .url-list{columns:1}}
@media(max-width:520px){.kpis{grid-template-columns:1fr 1fr}.hero h2{font-size:24px}}

/* ===== Human-in-the-loop Review ===== */
#view-review .hilr-toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin:0 0 18px}
#view-review .hilr-btn{background:var(--accent);color:#fff;border:0;border-radius:8px;padding:9px 15px;font-weight:600;cursor:pointer;font-size:13px;font-family:var(--sans)}
#view-review .hilr-btn:hover{background:var(--accent-2)}
#view-review .hilr-link{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:8px 12px;cursor:pointer;font-size:12.5px;color:var(--ink);font-family:var(--sans)}
#view-review .hilr-link:hover{border-color:var(--accent);color:var(--accent)}
#view-review .hilr-link.danger:hover{border-color:var(--custom);color:var(--custom)}
#view-review .hilr-note{color:var(--muted);font-size:12px;flex-basis:100%;line-height:1.55}
#view-review .hilr-panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);box-shadow:var(--sh);padding:18px 20px;margin-bottom:18px}
#view-review .hilr-panel h3{margin:0 0 4px;font-size:15px;font-family:var(--disp);font-weight:600}
#view-review .hilr-panel .cap{color:var(--muted);font-size:12.5px;margin-bottom:14px}
/* engagement */
#view-review .engform{display:flex;flex-wrap:wrap;gap:12px 18px}
#view-review .engfield{display:flex;flex-direction:column;gap:4px;font-size:10.5px;color:var(--muted);min-width:190px;flex:1}
#view-review .engfield.full{flex-basis:100%}
#view-review .engfield span{text-transform:uppercase;letter-spacing:.04em;font-weight:600;font-family:var(--mono)}
#view-review .eng-inp{font-size:13.5px;color:var(--ink);padding:7px 9px;border:1px solid var(--line);border-radius:7px;background:var(--panel);font-family:var(--sans)}
#view-review .eng-inp:focus{outline:none;border-color:var(--accent)}
#view-review .enggen{flex-basis:100%;color:var(--faint);font-size:11px;font-family:var(--mono)}
/* dropzone */
#view-review .hilr-drop{border:2px dashed var(--line);border-radius:var(--r);padding:18px 16px;text-align:center;color:var(--muted);background:var(--panel);margin-bottom:18px;cursor:pointer;font-size:13px;transition:border-color .12s,background .12s}
#view-review .hilr-drop:hover{border-color:var(--accent);color:var(--ink)}
#view-review .hilr-drop.drag{border-color:var(--accent);background:var(--accent-wash);color:var(--accent)}
#view-review .hilr-drop b{color:var(--accent)}
#view-review .hilr-drop .dz-sub{font-size:11.5px;margin-top:4px}
/* armbar / toast */
#view-review .hilr-armbar{display:none;background:var(--accent);color:#fff;border-radius:8px;padding:9px 13px;margin-bottom:14px;font-size:12.5px;align-items:center;gap:10px}
#view-review .hilr-armbar.on{display:flex}
#view-review .hilr-armbar button{margin-left:auto;background:rgba(255,255,255,.2);color:#fff;border:1px solid rgba(255,255,255,.55);border-radius:6px;padding:3px 10px;cursor:pointer;font-size:11.5px}
#hilr-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%) translateY(12px);background:var(--shell);color:#fff;padding:10px 18px;border-radius:22px;font-size:12.5px;opacity:0;pointer-events:none;transition:opacity .18s,transform .18s;z-index:120;box-shadow:var(--sh-lg)}
#hilr-toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
/* stats */
#view-review .hilr-stats{display:flex;flex-wrap:wrap;gap:12px;margin-bottom:16px}
#view-review .hilr-stat{flex:1;min-width:120px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;padding:12px 14px;text-align:center}
#view-review .hilr-stat .n{font-size:22px;font-weight:700;font-family:var(--disp)}
#view-review .hilr-stat .l{font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em;font-family:var(--mono)}
/* controls */
#view-review .hilr-ctrls{display:flex;align-items:center;gap:10px 16px;flex-wrap:wrap;margin-bottom:14px;padding:11px 13px;background:var(--panel-2);border:1px solid var(--line);border-radius:9px;font-size:12.5px}
#view-review .hilr-ctrls .cl{font-weight:600}
#view-review .hilr-ctrls .fsep{font-weight:600;margin-left:4px}
#view-review .hilr-ctrls select{font:inherit;padding:5px 8px;border:1px solid var(--line);border-radius:7px;background:var(--panel)}
#view-review .tagfilter{display:flex;flex-wrap:wrap;gap:6px}
#view-review .tchip{display:inline-flex;align-items:center;gap:5px;padding:3px 10px;border:1px solid var(--line);border-radius:20px;cursor:pointer;background:var(--panel);font-size:11.5px}
#view-review .tchip.on{border-color:var(--accent);background:var(--accent-wash);color:var(--accent);font-weight:700}
#view-review .tchip input{margin:0}
/* table */
#view-review .hilr-tblwrap{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--panel);box-shadow:var(--sh)}
#view-review table.hilr-t{width:100%;border-collapse:collapse;font-size:12.5px}
#view-review table.hilr-t th,#view-review table.hilr-t td{border-bottom:1px solid var(--line-soft);padding:10px 11px;vertical-align:top;text-align:left}
#view-review table.hilr-t th{background:var(--panel-2);font-size:10.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted);font-family:var(--mono)}
#view-review table.hilr-t td.c{text-align:center}
#view-review table.hilr-t td.b{font-weight:700}
#view-review .mono{font-family:var(--mono);font-size:10.5px;color:var(--muted)}
#view-review .muted{color:var(--muted)}
#view-review .hint{color:var(--muted);font-size:11.5px;margin:2px 0}
/* main block cell */
#view-review .mb{display:flex;gap:10px;align-items:flex-start}
#view-review .mbmeta{min-width:0;flex:1;display:flex;flex-direction:column;gap:5px}
#view-review .th{width:150px;height:96px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:7px;cursor:zoom-in}
#view-review .imgdrop{width:150px;height:96px;border:1px dashed var(--line);border-radius:7px;background:var(--panel-2);color:var(--muted);font-size:10.5px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;cursor:pointer;padding:4px}
#view-review .imgdrop:hover,#view-review .imgdrop.drag{border-color:var(--accent);color:var(--accent);background:var(--panel)}
#view-review .imgdrop b{font-size:17px;line-height:1}
#view-review .imgdrop span{font-size:9.5px}
/* variations */
#view-review .vrow{display:flex;flex-wrap:wrap;gap:9px;align-items:flex-start}
#view-review .vb{width:120px}
#view-review .vth{width:120px;height:76px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:6px;cursor:zoom-in;display:block}
#view-review .vb .noimg{width:120px;height:76px;display:flex;align-items:center;justify-content:center;background:var(--panel-2);color:var(--muted);font-size:10px;border-radius:6px}
#view-review .addvar{width:120px;border:1px dashed var(--line);border-radius:6px;padding:9px 6px;text-align:center;color:var(--muted);font-size:10.5px;cursor:pointer;background:var(--panel-2)}
#view-review .addvar:hover,#view-review .addvar.drag{border-color:var(--accent);color:var(--accent);background:var(--panel)}
#view-review .addvar b{display:block;font-size:15px;line-height:1;margin-bottom:2px}
/* inputs */
#view-review .f-name{font-weight:700;font-size:12.5px;width:100%}
#view-review .f-id{font-family:var(--mono);font-size:10.5px;width:100%;color:var(--muted)}
#view-review .f-src{font-size:10.5px;flex:1;min-width:0;color:var(--accent)}
#view-review .srcrow{display:flex;align-items:center;gap:6px}
#view-review .src-open,#view-review .vsrc-open{font-family:var(--mono);font-size:9.5px;font-weight:600;color:var(--accent);white-space:nowrap;text-decoration:none;flex:none}
#view-review .src-open:hover,#view-review .vsrc-open:hover{text-decoration:underline}
#view-review .vsrc-open{display:block;width:120px;margin-top:2px}
#view-review .f-core{font-size:11px;width:100%}
#view-review td.notes{min-width:280px}
#view-review .notes-inp{font-size:12px;line-height:1.5;width:100%;min-width:260px;min-height:96px;resize:vertical;font-family:var(--sans)}
#view-review .vbn-inp{font-size:10.5px;width:120px}
#view-review .vsrc-inp{font-size:9.5px;width:120px;margin-top:3px;color:var(--accent)}
#view-review .tag-inp{width:130px;font-size:11px}
#view-review input[type=text],#view-review input[type=number],#view-review textarea,#view-review select{font-family:var(--sans);padding:5px 7px;border:1px solid var(--line);border-radius:6px;background:var(--panel);color:var(--ink)}
#view-review input:focus,#view-review textarea:focus,#view-review select:focus{outline:none;border-color:var(--accent)}
#view-review .mvrow{margin-top:4px;display:flex;flex-wrap:wrap;gap:5px}
#view-review .mv-main,#view-review .mv-var{font-size:10.5px;padding:3px 5px;max-width:100%}
#view-review .mv-var{display:block;margin-top:3px;width:120px}
/* row buttons */
#view-review .rowbtn{background:var(--panel);border:1px solid var(--line);border-radius:6px;padding:3px 8px;font-size:10.5px;cursor:pointer;color:var(--ink)}
#view-review .rowbtn:hover{border-color:var(--accent)}
#view-review .rowbtn.danger{color:var(--custom)}
#view-review .rowbtn.danger:hover{background:var(--custom-wash);border-color:var(--custom)}
#view-review .vdel{display:block;margin-top:3px;width:120px;text-align:center}
/* badges */
#view-review .rvbadge{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;font-family:var(--mono)}
#view-review .rvbadge.core{background:var(--accent-wash);color:var(--accent)}
#view-review .rvbadge.custom{background:var(--custom-wash);color:var(--custom)}
#view-review .cxb{display:inline-block;padding:2px 9px;border-radius:20px;font-size:10.5px;font-weight:700;font-family:var(--mono)}
#view-review .cxb.cx-simple{background:var(--green-wash);color:var(--green)}
#view-review .cxb.cx-medium{background:var(--custom-wash);color:var(--custom)}
#view-review .cxb.cx-complex{background:#FBE3E1;color:#C0392B}
#view-review select.cx-simple{border-color:var(--green)}
#view-review select.cx-medium{border-color:var(--custom)}
#view-review select.cx-complex{border-color:#C0392B}
/* rows */
#view-review tr.brow.excluded{opacity:.42}
#view-review tr.brow.excluded .f-name{text-decoration:line-through}
#view-review .sel-chk{width:16px;height:16px;cursor:pointer}
#view-review .selcount{font-size:12px;color:var(--muted);margin-bottom:12px}
#view-review .selcount b{color:var(--ink)}
#view-review .rv-empty{text-align:center;padding:30px 16px;color:var(--muted)}
#view-review .rv-empty h3{margin:0 0 6px;color:var(--ink);font-size:15px}
#view-review table.hilr-t tr.grand td{background:var(--panel-2)}
#view-review td.tot{font-weight:800;color:var(--accent);font-size:16px;text-align:center}
#view-review .hr-inp{width:76px;text-align:center}
#view-review .hr-reset{margin-top:10px}
@media print{
  #view-review .hilr-toolbar,#view-review .hilr-drop,#view-review .hilr-armbar,#view-review .rowbtn,#view-review .mv-main,#view-review .mv-var,#view-review .addvar,#view-review .imgdrop,#hilr-toast{display:none !important}
  #view-review input,#view-review textarea,#view-review select{border-color:transparent !important;background:transparent !important;padding:0 !important;color:var(--ink) !important;-webkit-appearance:none;appearance:none}
  #view-review .th,#view-review .vth{cursor:default}
  #view-review tr{break-inside:avoid}
}

</style>

const METHOD = {"meta":{"Subject site":"https://lifree.kr/","Document":"Methodology & worked examples","Date":"2026-09-24","Example data":"The real lifree.kr analysis (13 live pages, 1 block variants)"},"purpose":{"intro":"This companion explains how the site-analysis report is produced: how pages are discovered across every locale and rendered, how content blocks are detected and typed, and how thousands of block instances consolidate into a compact set of reusable variants and layout families.","questions":["How are the base block types defined?","How are pages grouped so the crawl stays tractable?","On what basis are block instances consolidated into variants?"],"tip":"Jump to the two worked examples near the bottom — a news page and a business landing page traced through the whole process.","one_sentence":"Every page is rendered in a real browser, its content split into blocks, each block classified against a fixed list of base types, its structure measured, and near-identical blocks merged into variants — while whole pages are clustered into layout families."},"pipeline":[{"n":"1","stage":"URL discovery","what":"Find every page domain-wide (sitemap → crawl → browser fallback)."},{"n":"2","stage":"URL-pattern grouping","what":"Group live pages by path pattern; sample repeats, keep all long-tail."},{"n":"3","stage":"Render & cleanup","what":"Headless browser render; trigger lazy content; locale-aware, CJK font."},{"n":"4","stage":"Block detection","what":"Walk the page; split into blocks; assign each a base type."},{"n":"5","stage":"Fingerprinting","what":"Record each block’s structural signature and each page’s block order."},{"n":"6","stage":"Variant consolidation","what":"Merge near-identical blocks into unique variants per base type."},{"n":"7","stage":"Integration scan","what":"Scan page HTML for third-party scripts/embeds and JS globals."}],"stages":[{"n":"1","title":"URL discovery","lead":"The goal is a complete, un-sampled list of pages across every locale. Three methods are tried in order, each falling back to the next.","list":["Sitemap (fastest, most reliable when present).","Crawl (breadth-first, same-host links) as a fallback.","Headless-browser crawl (last resort for JS-heavy sites)."],"example":"A full crawl seeded at the domain root fetched 13 URLs → 13 live HTML pages + 0 documents across 0 locales."},{"n":"2","title":"URL-pattern grouping & rendering","lead":"Live pages are grouped by final-path-level pattern so the render stays tractable without missing anything; representative pages and all long-tail uniques are rendered in a headless browser with a Japanese font installed.","list":["Recurring patterns (≥2 pages) are sampled.","All long-tail unique pages are rendered in full.","Attachments/images are excluded from rendering."],"example":"1 recurring patterns were sampled and undefined long-tail pages rendered in full → a 5-page render set."}],"detection":{"lead":"The cleaned page is walked top-down. Each candidate block is assigned a base type using a heuristic priority cascade over DOM signals — the first rule that matches wins.","tiers":[{"tier":"1","signal":"Class/id keywords","example":"class contains \"breadcrumb\" → breadcrumbs; \"hero/mv/keyvisual\" → hero; \"carousel/swiper\" → carousel"},{"tier":"2","signal":"Semantic HTML","example":"\u003ctable> → table; \u003cform>/inputs → form; \u003ciframe> → embed"},{"tier":"3","signal":"Content heuristics","example":"grid with ≥2 images / ≥4 links → cards; many \u003cli> + links → list"},{"tier":"4","signal":"Media vs text","example":"image with little text → media; heading + body → text"},{"tier":"5","signal":"Fallback","example":"nothing distinctive → folded into the text/body catch-all"}],"note":"Blocks with composite structure but no recognised signal fall through to \"unknown / custom\" (0 variants, 0 instances) — the honest catch-all for bespoke structures, kept for manual review. Plain prose stays \"text\"."},"taxonomy":{"lead":"The base types are a fixed vocabulary mirroring the standard AEM Edge Delivery / Block Collection conventions. Here are the types actually found on lifree.kr, with their variant / instance counts.","rows":[{"type":"text","terms":"1 variants · 1 instances"}],"note":"Counts come from the block-level capture across the render set; the \"text\" base intentionally absorbs anything without a distinctive signal."},"fingerprint":{"lead":"Two structural measurements drive the analysis: a per-block signature (for variant dedup) and a per-page block order (for layout clustering).","rows":[{"characteristic":"block signature","values":"tag + child histogram + feature flags","meaning":"Identifies near-identical blocks of the same type."},{"characteristic":"page fingerprint","values":"e.g. hero › media › cards › text","meaning":"Ordered list of a page’s top-level blocks."},{"characteristic":"feature flags","values":"img / table / list / form / iframe","meaning":"Presence of key elements inside a block."},{"characteristic":"link & image counts","values":"bucketed (0–9+)","meaning":"Separates dense grids from simple blocks."}]},"consolidation":{"lead":"5 rendered pages produced 1 block instances. Near-identical blocks are consolidated into 1 variants, comparing only blocks of the same base type.","exact_title":"Signature match","exact":"Blocks with the same base type and normalized structural signature collapse into one variant immediately.","weighted_title":"Representative selection","weighted_lead":"For each variant, the instance with the richest content becomes the representative shown in the gallery, and its page URL is recorded as the source.","weights":[{"characteristic":"base type","weight":"—","when":"only blocks of the same type are compared"},{"characteristic":"tag + children","weight":"—","when":"same wrapper tag and child-tag histogram"},{"characteristic":"feature flags","weight":"—","when":"same img/table/list/form/iframe presence"},{"characteristic":"link bucket","weight":"—","when":"same bucketed link count"},{"characteristic":"image bucket","weight":"—","when":"same bucketed image count"}],"idnote":"Variant IDs combine the base type, a label from the block’s heading, and its instance count — the labels used throughout the Blocks galleries."},"template_discovery":{"lead":"Separately, whole pages are fingerprinted and clustered into layout families with structure-based names; family page-counts are extrapolated to the full population via URL-pattern membership.","example":"13 live pages consolidated into 3 layout families — the largest, article-text, covers ~3 pages. A migration builds ~3 templates, not thousands of bespoke pages."},"integration_scan":{"lead":"The delivered HTML of every rendered page is scanned for third-party service signatures (script/iframe hosts, JS globals), aggregated site-wide and per layout family.","example":"5 pages scanned. Google Tag Manager, OneTrust/Cookiebot consent and Google Analytics are near-universal; a dataLayer global appears on the majority of pages."},"examples_intro":"The two diagrams below trace two real blocks through the whole process. Read each top-to-bottom: the block screenshot, the five type-detection tiers (green = matched, grey = skipped), the measured fingerprint, then the final result. Example A is recognised as a standard type; Example B is not, and becomes an \"unknown / custom\" block.","examples":[{"title":"Example A — a block that IS a standard type (Cards)","img":"cards-diagram.jpg","desc":"A grid of linked promo tiles (group companies). Its container’s class contains \"grid / card / link\" and it holds several images and links.","reading":"Matched at Tier 1 (class keyword) → base type cards → measured img + list + heading + links → catalogued as a cards variant with its source URL. Recognised automatically."},{"title":"Example B — a block that is NOT a standard type (Unknown)","img":"unknown-diagram.jpg","desc":"A composite section — an image banner with a heading and supporting elements. Its container carries no standard class keyword and is not a table/form/iframe.","reading":"No match at Tiers 1–4 → folded into the unknown / custom group → still measured and screenshotted. \"Unknown\" means \"no automatic signal\", not \"unusable\"; these blocks warrant a human review before build."}],"key_contrast":"High-volume templated pages (news / IR archives) and distinctive long-tail pages (governance, business landing, contact forms) are handled by different migration tracks — bulk import versus bespoke build.","how_to_read":[{"section":"Overview","shows":"Headline counts (pages, families, block variants, integrations)."},{"section":"Page Templates","shows":"The layout families, page-population estimates, key blocks and a full-page screenshot per family."},{"section":"Blocks & Components","shows":"Block variants grouped by base type, each with a cropped screenshot and source URL."},{"section":"URL Coverage","shows":"The complete crawl inventory grouped by locale, plus status counts."},{"section":"Integrations","shows":"Third-party services site-wide and per layout family."}],"limitations":["Heuristic, not authoritative. Block typing keys off DOM signals; the \"text\" base over-splits and absorbs anything without a distinctive signal.","Layout counts are extrapolated. Family page-populations are estimated from URL-pattern sampling, not a full render of all pages.","Screenshots are representative. Each variant’s image comes from one representative instance at crawl time.","Documents are assets, not pages. The ~2,650 PDFs are inventoried but not rendered."],"bottom_line":"lifree.kr reduces to 3 layout families and 1 block variants — a tractable set to scope an EDS migration despite 13 live pages. The \"text\" catch-all and any unusual assignments warrant a human review before build estimates are finalised."};

  function slug(s){return String(s||'').toLowerCase().replace(/[^a-z0-9]+/g,'-').replace(/^-|-$/g,'');}

  // ---------- seed from analysis ----------
  function seed(){
    var typeSummary={}; (DATA.blocktype_summary||[]).forEach(function(s){ typeSummary[s.type]=s; });
    var items=[], ord=0;
    (DATA.galleries||[]).forEach(function(g){
      var fam=g.name, mid='m-'+slug(fam);
      var t=FAMILY_TYPE[fam]||'Custom', cx=FAMILY_CX[fam]||'Medium';
      var sum=typeSummary[FAMILY_TYPEKEY[fam]]||{};
      var noteBits=[];
      if(sum.variants) noteBits.push(sum.variants+' variants');
      if(sum.instances) noteBits.push(sum.instances+' instances site-wide');
      if(sum.pct) noteBits.push(sum.pct+' of all variants');
      if(sum.eds) noteBits.push('detector class: '+sum.eds);
      var firstImg=(g.variants[0]&&g.variants[0].img)||'';
      items.push({id:mid,parentId:null,ord:ord++,name:fam,internalId:'BLK-'+slug(fam).toUpperCase(),
        img:firstImg,sourceUrl:(g.variants[0]&&g.variants[0].url)||'',type:t,complexity:cx,
        coreBlockType:FAMILY_CORE[fam]||'',notes:noteBits.join(' · '),patterns:[],
        tags:[slug(fam),(t==='Custom'?'custom':'core')],selected:true});
      g.variants.forEach(function(v){
        items.push({id:'v-'+v.id,parentId:mid,ord:ord++,name:v.id,internalId:'',
          img:v.img||'',sourceUrl:v.url||'',type:t,complexity:cx,coreBlockType:'',
          notes:v.traits||'',patterns:[],tags:[],selected:true});
      });
    });
    return {
      engagement:{accountName:'Unicharm — Lifree Korea',dealRegNo:'',caseId:'',solutionArchitect:'',executor:'',startDate:'',remarks:'Pre-seeded from the automated site analysis of lifree.kr ('+((DATA.meta&&DATA.meta['Pages analyzed'])||'')+'). Review, re-categorize, adjust complexity/type and refine the effort estimate below.'},
      generated:(DATA.meta&&DATA.meta['Analysis date'])||'',
      hours:JSON.parse(JSON.stringify(DEFAULT_HOURS)),
      defaultHours:JSON.parse(JSON.stringify(DEFAULT_HOURS)),
      ui:{sort:'orig',filter:[]},
      items:items
    };
  }

  // ---------- load / persist ----------
  var D;
  function load(){
    var raw=null;
    try{ raw=localStorage.getItem(LS_KEY); }catch(e){}
    if(!raw){ var tag=document.getElementById('__review'); if(tag && tag.textContent.trim()) raw=tag.textContent; }
    if(raw){ try{ D=JSON.parse(raw); }catch(e){ D=null; } }
    if(!D || !D.items || !D.items.length) D=seed();
    if(!D.ui) D.ui={sort:'orig',filter:[]};
    if(!D.hours) D.hours=JSON.parse(JSON.stringify(DEFAULT_HOURS));
    if(!D.defaultHours) D.defaultHours=JSON.parse(JSON.stringify(DEFAULT_HOURS));
    D.items.forEach(function(it){ if(!it.tags)it.tags=[]; if(!it.patterns)it.patterns=[]; if(it.selected===undefined)it.selected=true; });
  }
  function persist(){ try{ localStorage.setItem(LS_KEY, JSON.stringify(D)); }catch(e){} }

  // ---------- image resolution ----------
  function imgSrc(x){ if(!x) return ''; if(typeof IMAGES!=='undefined' && IMAGES[x]) return IMAGES[x]; if(String(x).slice(0,5)==='data:') return x; return ''; }
  function syncSrcLink(sel, id, url){ var a=$(sel+'[data-id="'+id+'"]'); if(!a) return; url=(url||'').trim(); if(url){ a.href=abs(url); a.style.display=''; } else { a.removeAttribute('href'); a.style.display='none'; } }

  // ---------- data helpers ----------
  function newId(){ return 'B'+Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
  function byId(id){ for(var i=0;i<D.items.length;i++){ if(D.items[i].id===id) return D.items[i]; } return null; }
  function childrenOf(id){ return D.items.filter(function(it){ return it.parentId===id; }).sort(function(a,b){ return a.ord-b.ord; }); }
  function allMains(){ return D.items.filter(function(it){ return it.parentId==null; }); }
  function nextOrd(){ var m=-1; D.items.forEach(function(it){ if(it.ord>m) m=it.ord; }); return m+1; }
  function mkItem(o){ var b={id:newId(),parentId:null,ord:nextOrd(),name:'',internalId:'',img:'',sourceUrl:'',type:'Custom',complexity:'Medium',coreBlockType:'',notes:'',patterns:[],tags:[],selected:true}; for(var k in o) b[k]=o[k]; return b; }
  function sortedMains(){
    var m=allMains().slice();
    if(D.ui.sort==='az') m.sort(function(a,b){ var x=(a.name||'').toLowerCase(),y=(b.name||'').toLowerCase(); return x<y?-1:(x>y?1:a.ord-b.ord); });
    else if(D.ui.sort==='za') m.sort(function(a,b){ var x=(a.name||'').toLowerCase(),y=(b.name||'').toLowerCase(); return x>y?-1:(x<y?1:a.ord-b.ord); });
    else m.sort(function(a,b){ return a.ord-b.ord; });
    return m;
  }
  function passesFilter(it){ if(!D.ui.filter.length) return true; for(var i=0;i<it.tags.length;i++){ if(D.ui.filter.indexOf(it.tags[i])>=0) return true; } return false; }
  function displayMains(){ return sortedMains().filter(passesFilter); }
  function effortMains(){ return displayMains().filter(function(it){ return it.selected!==false; }); }
  function allTags(){ var s={}; D.items.forEach(function(it){ (it.tags||[]).forEach(function(t){ s[t]=1; }); }); return Object.keys(s).sort(); }
  function parseTags(str){ var seen={},out=[]; String(str||'').split(',').forEach(function(t){ t=t.trim(); if(t&&!seen[t.toLowerCase()]){ seen[t.toLowerCase()]=1; out.push(t); } }); return out; }

  // ---------- image ingestion ----------
  var pasteTarget=null, fileMode=null;
  function prepImage(file, cb){
    if(!file || !/^image\//.test(file.type)){ cb(null); return; }
    var url=URL.createObjectURL(file), im=new Image();
    function fallback(){ var r=new FileReader(); r.onload=function(){ cb(r.result); }; r.onerror=function(){ cb(null); }; r.readAsDataURL(file); }
    im.onload=function(){
      var max=1600, w=im.naturalWidth, h=im.naturalHeight;
      if(!w||!h||Math.max(w,h)<=max){ URL.revokeObjectURL(url); fallback(); return; }
      var s=max/Math.max(w,h), cw=Math.round(w*s), ch=Math.round(h*s);
      try{ var c=document.createElement('canvas'); c.width=cw; c.height=ch; c.getContext('2d').drawImage(im,0,0,cw,ch); URL.revokeObjectURL(url); cb(c.toDataURL('image/jpeg',0.82)); }
      catch(e){ URL.revokeObjectURL(url); fallback(); }
    };
    im.onerror=function(){ URL.revokeObjectURL(url); fallback(); };
    im.src=url;
  }
  function collectImageFiles(list){ var out=[]; if(!list) return out; for(var i=0;i<list.length;i++){ var f=list[i]; if(f && /^image\//.test(f.type)) out.push(f); } return out; }
  function handleFiles(fileList, mode){
    var files=collectImageFiles(fileList);
    if(!files.length){ toast('No image found in that.'); return; }
    var results=new Array(files.length), done=0;
    files.forEach(function(f,idx){ prepImage(f,function(u){ results[idx]=u; if(++done===files.length){ applyImages(results.filter(Boolean), mode||{}); } }); });
  }
  function applyImages(urls, mode){
    if(!urls.length) return;
    if(mode.type==='image'){ var b=byId(mode.id); if(b)b.img=urls[0]; urls.slice(1).forEach(function(u){ addVariationData(mode.id,u); }); }
    else if(mode.type==='variation'){ urls.forEach(function(u){ addVariationData(mode.parentId,u); }); }
    else { urls.forEach(function(u){ addMainData(u); }); }
    disarm(); persist(); refreshAll();
    toast(urls.length+' image'+(urls.length>1?'s':'')+' added.');
  }
  function addMainData(im){ var n=allMains().length+1; D.items.push(mkItem({parentId:null,img:im||'',name:'Block '+n})); }
  function addVariationData(parentId, im){ var p=byId(parentId); if(!p||p.parentId!=null) parentId=(p&&p.parentId)||parentId; var n=childrenOf(parentId).length+1; D.items.push(mkItem({parentId:parentId,img:im||'',name:'Variation '+n})); }
  function deleteBlock(id){
    var b=byId(id); if(!b) return;
    var kids=childrenOf(id);
    if(b.parentId==null && kids.length){
      if(!confirm('Delete "'+(b.name||'this block')+'" and its '+kids.length+' variation'+(kids.length>1?'s':'')+'?\n\nTo keep a variation, split it into its own block first.')) return;
      D.items=D.items.filter(function(it){ return it.id!==id && it.parentId!==id; });
    } else { D.items=D.items.filter(function(it){ return it.id!==id; }); }
    disarm(); persist(); refreshAll();
  }

  function arm(target, text){ pasteTarget=target; fileMode=target; var bar=$('#hilr-armbar'); $('#hilr-armtext').textContent=text; bar.classList.add('on'); }
  function disarm(){ pasteTarget=null; fileMode=null; var bar=$('#hilr-armbar'); if(bar) bar.classList.remove('on'); }
  function toast(msg){ var t=$('#hilr-toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(function(){ t.classList.remove('show'); }, 1900); }

      h+='<span class="fsep">Filter by tag:</span><span class="tagfilter">';
      tags.forEach(function(t){ var on=D.ui.filter.indexOf(t)>=0; h+='<label class="tchip'+(on?' on':'')+'"><input type="checkbox" class="rvTf" value="'+esc(t)+'"'+(on?' checked':'')+'> '+esc(t)+'</label>'; });

    } else { h+='<span class="fsep muted">Add tags in the table to enable category filtering.</span>'; }

  function mvVarOptions(v){ var h='<option value="">Split or move…</option><option value="__main">⬆ Split into its own block</option>'; sortedMains().forEach(function(t){ if(t.id!==v.parentId) h+='<option value="'+t.id+'">Move under: '+esc(t.name||'(unnamed)')+'</option>'; }); return h; }

  // ---------- blocks table ----------
  function mainImgCell(b){ var s=imgSrc(b.img); if(s) return '<img class="rvzoom th" src="'+s+'" data-title="'+esc(b.name)+'" alt="">'; return '<div class="imgdrop main-imgdrop" data-id="'+b.id+'"><b>＋</b>Add image<span>paste · drop · click</span></div>'; }
  function blocksTable(){

    if(!allMains().length){ h+='<tr><td colspan="8"><div class="rv-empty"><h3>No blocks yet</h3><div>Copy a screenshot, then press <b>⌘/Ctrl+V</b> — or drop images on the zone above — to add your first block.</div></div></td></tr>'; return h+'</tbody></table></div>'; }
    if(!mains.length) h+='<tr><td colspan="8" class="muted c">No blocks match the current filter.</td></tr>';
    mains.forEach(function(b){
      var kids=childrenOf(b.id);
      var main='<div class="mb">'+mainImgCell(b)+'<div class="mbmeta">'

        +'<div class="srcrow"><input type="text" class="f-src" data-id="'+b.id+'" value="'+esc(b.sourceUrl)+'" placeholder="Source URL (optional)"><a class="src-open" data-id="'+b.id+'" href="'+esc(abs(b.sourceUrl))+'" target="_blank" rel="noopener" title="Open source page in a new tab"'+(b.sourceUrl?'':' style="display:none"')+'>open ↗</a></div>'
        +'<div class="mvrow"><select class="mv-main" data-id="'+b.id+'" title="Demote this block to a variation of another block">'+mvMainOptions(b)+'</select>'
        +'<button type="button" class="rowbtn danger del-main" data-id="'+b.id+'">🗑 Delete</button></div></div></div>';
      var vh=kids.map(function(v){ var vs=imgSrc(v.img);
        return '<div class="vb">'+(vs?'<img class="rvzoom vth" src="'+vs+'" data-title="'+esc(v.name)+'" alt="">':'<div class="noimg vth">no image</div>')
          +'<input type="text" class="vbn-inp" data-id="'+v.id+'" value="'+esc(v.name)+'" placeholder="Variation name">'
          +'<input type="text" class="vsrc-inp" data-id="'+v.id+'" value="'+esc(v.sourceUrl)+'" placeholder="Source URL">'
          +'<a class="vsrc-open" data-id="'+v.id+'" href="'+esc(abs(v.sourceUrl))+'" target="_blank" rel="noopener" title="Open source page in a new tab"'+(v.sourceUrl?'':' style="display:none"')+'>open source ↗</a>'
          +'<select class="mv-var" data-id="'+v.id+'" title="Split into its own block, or move under another block">'+mvVarOptions(v)+'</select>'

    });
    return h+'</tbody></table></div>';
  }

  // ---------- summary + estimate ----------
  function summaryHtml(){
    var sel=effortMains(), shown=displayMains().length;
    var t={Simple:0,Medium:0,Complex:0,Core:0,Custom:0,vars:0};
    sel.forEach(function(b){ t[b.complexity]++; t[b.type]++; t.vars+=childrenOf(b.id).length; });
    var fnote=D.ui.filter.length?(' · filtered by tag: '+esc(D.ui.filter.join(', '))):'';

    h+='<div class="hilr-tblwrap"><table class="hilr-t"><thead><tr><th>#</th><th>Consolidated block</th><th>Type</th><th>Variations</th><th>Build complexity</th><th>Tags</th><th>Core type</th></tr></thead><tbody>';
    sel.forEach(function(b,i){ h+='<tr><td class="muted">'+(i+1)+'</td><td><b>'+esc(b.name||'(unnamed)')+'</b> <span class="mono">'+esc(b.internalId)+'</span></td><td><span class="rvbadge '+b.type.toLowerCase()+'">'+b.type+'</span></td><td class="c">'+childrenOf(b.id).length+'</td><td><span class="cxb cx-'+b.complexity.toLowerCase()+'">'+b.complexity+'</span></td><td class="muted">'+esc((b.tags||[]).join(', '))+'</td><td class="muted">'+esc(b.coreBlockType)+'</td></tr>'; });
    if(!sel.length) h+='<tr><td colspan="7" class="muted c">No blocks selected — add a block, tick a checkbox, or adjust the filter above.</td></tr>';

  function estCounts(){ var c={Core:{Simple:0,Medium:0,Complex:0},Custom:{Simple:0,Medium:0,Complex:0}}; effortMains().forEach(function(b){ if(c[b.type]&&c[b.type][b.complexity]!=null) c[b.type][b.complexity]++; }); return c; }
  function estimateHtml(){
    var c=estCounts(), grand=0;

    h+='<tr class="grand"><td colspan="4" style="text-align:right"><b>Total development hours</b></td><td class="c tot">'+grand+'</td></tr></tbody></table></div>';
    h+='<button class="hilr-link hr-reset" type="button">Reset hours to defaults</button> <span class="hint">Counts follow the current grouping, selection and tag filter. Total = hours × count.</span>';

  }

  function bindBlocks(){

    $$('.sel-chk').forEach(function(cb){ cb.addEventListener('change', function(){ byId(cb.getAttribute('data-id')).selected=cb.checked; var tr=cb.closest('tr'); if(tr) tr.className='brow'+(cb.checked?'':' excluded'); refreshDerived(); }); });

    $$('.f-name').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).name=inp.value; refreshDerived(); }); });

    $$('.f-core').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).coreBlockType=inp.value; refreshDerived(); }); });
    $$('.notes-inp').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).notes=inp.value; persist(); }); });
    $$('.vbn-inp').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).name=inp.value; persist(); }); });
    $$('.vsrc-inp').forEach(function(inp){ inp.addEventListener('input', function(){ byId(inp.getAttribute('data-id')).sourceUrl=inp.value; syncSrcLink('.vsrc-open',inp.getAttribute('data-id'),inp.value); persist(); }); });
    $$('.mv-main').forEach(function(sel){ sel.addEventListener('change', function(){ var t=sel.value; if(!t) return; var m=byId(sel.getAttribute('data-id')); var kids=childrenOf(m.id); m.parentId=t; kids.forEach(function(c){ c.parentId=t; }); refreshAll(); }); });
    $$('.mv-var').forEach(function(sel){ sel.addEventListener('change', function(){ var val=sel.value; if(!val) return; var v=byId(sel.getAttribute('data-id')); v.parentId=(val==='__main')?null:val; refreshAll(); }); });
    $$('.del-main').forEach(function(b){ b.addEventListener('click', function(){ deleteBlock(b.getAttribute('data-id')); }); });
    $$('.del-var').forEach(function(b){ b.addEventListener('click', function(){ deleteBlock(b.getAttribute('data-id')); }); });
    $$('.addvar').forEach(function(z){ var id=z.getAttribute('data-id'); z.addEventListener('click', function(){ armVariation(id); fileMode={type:'variation',parentId:id}; $('#hilr-file').click(); }); dropify(z, function(files){ handleFiles(files,{type:'variation',parentId:id}); }); });
    $$('.main-imgdrop').forEach(function(z){ var id=z.getAttribute('data-id'); z.addEventListener('click', function(){ armImage(id); fileMode={type:'image',id:id}; $('#hilr-file').click(); }); dropify(z, function(files){ handleFiles(files,{type:'image',id:id}); }); });
    $$('#rv-blocks .rvzoom').forEach(function(im){ im.addEventListener('click', function(){ openReviewImg(im.getAttribute('src'), im.getAttribute('data-title')); }); });
    var ss=$('#rvSort'); if(ss) ss.addEventListener('change', function(){ D.ui.sort=ss.value; refreshAll(); });
    $$('.rvTf').forEach(function(cb){ cb.addEventListener('change', function(){ var v=cb.value, i=D.ui.filter.indexOf(v); if(cb.checked){ if(i<0) D.ui.filter.push(v); } else if(i>=0) D.ui.filter.splice(i,1); refreshAll(); }); });
    var cf=$('#rvClrFilter'); if(cf) cf.addEventListener('click', function(){ D.ui.filter=[]; refreshAll(); });
  }
  function dropify(el, cb){
    el.addEventListener('dragover', function(e){ e.preventDefault(); e.stopPropagation(); el.classList.add('drag'); });
    el.addEventListener('dragleave', function(e){ e.stopPropagation(); el.classList.remove('drag'); });
    el.addEventListener('drop', function(e){ e.preventDefault(); e.stopPropagation(); el.classList.remove('drag'); cb(e.dataTransfer.files); });
  }

  // ---------- save a copy ----------
  function saveCopy(){
    persist();
    var tag=document.getElementById('__review'); if(tag) tag.textContent=JSON.stringify(D).split('<').join('\\u003c');
    var ids=['side-nav','rv-eng','rv-blocks','rv-summary','rv-estimate'], snap={};
    ids.forEach(function(id){ var n=document.getElementById(id); if(n){ snap[id]=n.innerHTML; n.innerHTML=''; } });
    var out='<!DOCTYPE html>\n'+document.documentElement.outerHTML;
    ids.forEach(function(id){ var n=document.getElementById(id); if(n) n.innerHTML=snap[id]; });
    var acct=slug(D.engagement.accountName||'');
    var a=document.createElement('a');
    a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));
    a.download='lifree-kr-block-review'+(acct?'-'+acct:'')+'.html';
    document.body.appendChild(a); a.click();
    setTimeout(function(){ URL.revokeObjectURL(a.href); a.parentNode&&a.parentNode.removeChild(a); }, 1200);
    toast('Saved a self-contained copy with your changes.');
  }
  function resetAll(){
    if(!confirm('Reset the review back to the automated analysis baseline?\n\nThis discards all your manual changes on this device.')) return;
    try{ localStorage.removeItem(LS_KEY); }catch(e){}
    D=seed(); persist(); render(); toast('Reset to analysis baseline.');
  }

  // ---------- top-level render (called once by dashboard on first open) ----------
  function render(){
    var v=$('#view-review');
    v.innerHTML=''
      +'<p class="section-lead">A working canvas for the migration team to <b>manually validate and refine</b> the automated block analysis before it feeds the build. Every block, variation, categorization, complexity rating and effort assumption below is editable. The tool is pre-seeded from the analysis (1 base block families, '+((DATA.galleries||[]).reduce(function(a,g){return a+g.variants.length;},0))+' variants) — re-group, re-classify, exclude noise, add anything the crawler missed, and read off a live effort estimate. Your changes are saved in this browser automatically; use “Save a copy” to hand off a self-contained file.</p>'
      +'<div class="hilr-toolbar">'
        +'<button class="hilr-btn" id="rv-save">💾 Save a copy (with my changes)</button>'
        +'<button class="hilr-link" id="rv-print">🖨 Print / Save as PDF</button>'
        +'<button class="hilr-link" id="rv-addblank">➕ Add empty block</button>'
        +'<button class="hilr-link danger" id="rv-reset">↺ Reset to analysis baseline</button>'
        +'<span class="hilr-note"><b>Copy a screenshot</b> (Win+Shift+S / ⌘⌃⇧4) then press <b>⌘/Ctrl+V</b> anywhere to add it as a new main block. Attach <b>variations</b> to a block, <b>split</b> a variation into its own block, move blocks around, tag and filter, include/exclude from the estimate, and edit every field. The consolidation summary and effort estimate recompute live.</span>'
      +'</div>'
      +'<div class="hilr-armbar" id="hilr-armbar"><span id="hilr-armtext"></span><button id="hilr-armcancel" type="button">Cancel (Esc)</button></div>'
      +'<div class="hilr-panel"><h3>Engagement details</h3><div class="cap">Captured separately from the analysis — fill in for this specific customer engagement.</div><div id="rv-eng"></div></div>'
      +'<div class="hilr-drop" id="hilr-drop"><div>📋 <b>Paste a screenshot</b> (⌘/Ctrl+V), drop images here, or click to choose files.</div><div class="dz-sub">Each image becomes a new main block. You can add variations to any block below.</div></div>'
      +'<input type="file" id="hilr-file" accept="image/*" multiple style="display:none">'
      +'<div class="hilr-panel"><h3>Blocks &amp; variations</h3><div class="cap">Consolidated reusable UI blocks, their variations, source URLs, build complexity and type. Edit anything.</div><div id="rv-blocks"></div></div>'
      +'<div class="hilr-panel"><h3>Consolidation summary</h3><div class="cap">Live rollup of the blocks currently included above.</div><div id="rv-summary"></div></div>'
      +'<div class="hilr-panel"><h3>Development effort estimate</h3><div class="cap">Adjust the hours per block/complexity; totals follow your grouping and selection.</div><div id="rv-estimate"></div></div>';
    $('#rv-eng').innerHTML=engHtml(); bindEng();
    refreshAll();
    // wire toolbar + dropzone
    $('#rv-save').onclick=saveCopy;
    $('#rv-print').onclick=function(){ window.print(); };
    $('#rv-addblank').onclick=function(){ addMainData(''); persist(); refreshAll(); toast('Empty block added — paste or drop its image.'); };
    $('#rv-reset').onclick=resetAll;
    $('#hilr-armcancel').onclick=disarm;
    var dz=$('#hilr-drop');
    dz.addEventListener('click', function(){ disarm(); fileMode=null; $('#hilr-file').click(); });
    dropify(dz, function(files){ handleFiles(files,{}); });
    $('#hilr-file').addEventListener('change', function(){ var mode=fileMode||{}; handleFiles(this.files, mode); this.value=''; });
  }

  // global clipboard paste — only act when the Review view is active
  document.addEventListener('paste', function(e){
    var view=$('#view-review'); if(!view || !view.classList.contains('active')) return;
    var files=collectImageFiles(e.clipboardData && e.clipboardData.files);
    if(!files.length && e.clipboardData && e.clipboardData.items){
      for(var i=0;i<e.clipboardData.items.length;i++){ var it=e.clipboardData.items[i]; if(it.kind==='file' && /^image\//.test(it.type)){ var f=it.getAsFile(); if(f) files.push(f); } }
    }
    if(!files.length) return;
    e.preventDefault();
    handleFiles(files, pasteTarget||{});
  });
  document.addEventListener('keydown', function(e){ if(e.key==='Escape') disarm(); });

  // expose a single entry point for the dashboard renderer
  load();
  window.__renderReview=render;
})();

</script>
</body>
</html>
